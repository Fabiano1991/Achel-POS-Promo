<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17130f">

  <title>Achel B2B - Dag wijzigen</title>

  <link rel="stylesheet" href="./b2b.css">
</head>

<body>

  <div class="b2b-app">

    <header class="b2b-header">

      <a
        href="./admin.html"
        class="back-button"
        aria-label="Terug"
      >
        ←
      </a>

      <div class="header-text">
        <span class="header-eyebrow">Achelse Kluis</span>
        <h1>B2B-dag wijzigen</h1>
      </div>

    </header>


    <main class="b2b-main">

      <section class="welcome-section">

        <p class="welcome-label">
          Beheer
        </p>

        <h2 id="editDayHeading">
          B2B-dag laden...
        </h2>

        <p class="welcome-description">
          Pas datum, locatie, capaciteit en status van deze B2B-dag aan.
        </p>

      </section>


      <section class="b2b-form-card">

        <label for="editDayTitle">
          Naam
        </label>

        <input
          id="editDayTitle"
          type="text"
        >


        <label for="editDayDate">
          Datum
        </label>

        <input
          id="editDayDate"
          type="date"
        >


        <label for="editDayStartTime">
          Startuur
        </label>

        <input
          id="editDayStartTime"
          type="time"
        >


        <label for="editDayEndTime">
          Einduur
        </label>

        <input
          id="editDayEndTime"
          type="time"
        >


        <label for="editDayLocation">
          Locatie
        </label>

        <input
          id="editDayLocation"
          type="text"
        >


        <label for="editDayCapacity">
          Totale capaciteit
        </label>

        <input
          id="editDayCapacity"
          type="number"
          min="0"
        >


        <label for="editDayStatus">
          Status
        </label>

        <select id="editDayStatus">

          <option value="draft">
            Concept
          </option>

          <option value="open">
            Open
          </option>

          <option value="full">
            Volzet
          </option>

          <option value="closed">
            Afgesloten
          </option>

          <option value="cancelled">
            Geannuleerd
          </option>

        </select>


        <label for="editDayDescription">
          Beschrijving
        </label>

        <textarea
          id="editDayDescription"
        ></textarea>


        <button
          id="editDaySaveButton"
          class="b2b-submit"
          type="button"
          onclick="saveB2BDayChanges()"
        >
          Wijzigingen opslaan
        </button>


        <div
          id="editDayMessage"
          class="status-message"
          hidden
        ></div>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./b2b.js"></script>

</body>
</html>
