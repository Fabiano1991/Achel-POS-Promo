<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17130f">

  <title>Achel B2B - Quota beheren</title>

  <link rel="stylesheet" href="./b2b.css">
</head>

<body>

  <div class="b2b-app">

    <header class="b2b-header">

      <a
        href="./admin.html"
        class="back-button"
        aria-label="Terug"
      >
        ←
      </a>

      <div class="header-text">
        <span class="header-eyebrow">Achelse Kluis</span>
        <h1>Quota beheren</h1>
      </div>

    </header>


    <main class="b2b-main">

      <section class="welcome-section">

        <p class="welcome-label">
          B2B-dag
        </p>

        <h2 id="quotaDayTitle">
          B2B-dag laden...
        </h2>

        <p
          id="quotaDayMeta"
          class="welcome-description"
        ></p>

      </section>


      <section class="quota-summary-card">

        <div>

          <span>
            Totale capaciteit
          </span>

          <strong id="quotaTotalCapacity">
            —
          </strong>

        </div>


        <div>

          <span>
            Verdeeld
          </span>

          <strong id="quotaAssignedTotal">
            —
          </strong>

        </div>


        <div>

          <span>
            Nog vrij
          </span>

          <strong id="quotaUnassignedTotal">
            —
          </strong>

        </div>

      </section>


      <section>

        <div id="quotaRepresentativesList">

          <div class="status-message">
            Vertegenwoordigers laden...
          </div>

        </div>


        <button
          id="quotaSaveButton"
          class="b2b-submit"
          type="button"
          onclick="saveB2BQuotas()"
        >
          Quota opslaan
        </button>


        <div
          id="quotaSaveMessage"
          class="status-message"
          hidden
        ></div>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./b2b.js"></script>

</body>
</html>
