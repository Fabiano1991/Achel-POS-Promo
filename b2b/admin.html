<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <title>Achel B2B - Beheer</title>
  <link rel="stylesheet" href="./b2b.css">
</head>
<body>
  <div class="b2b-app">
    <header class="b2b-header">
      <a href="./index.html" class="back-button" aria-label="Terug">←</a>
      <div class="header-text">
        <span class="header-eyebrow">Achelse Kluis</span>
        <h1>B2B beheer</h1>
      </div>
    </header>

    <main class="b2b-main">
      <section class="welcome-section">
        <p class="welcome-label">Beheer</p>
        <h2>B2B-dagen beheren</h2>
        <p class="welcome-description">Maak B2B-dagen aan, bepaal capaciteit en volg inschrijvingen, opkomst en commerciële resultaten op.</p>
      </section>

      <section class="b2b-form-card">
        <h3>Nieuwe B2B-dag</h3>

        <label for="adminDayTitle">Naam</label>
        <input id="adminDayTitle" type="text" placeholder="Bijv. Horeca B2B september">

        <label for="adminDayDate">Datum</label>
        <input id="adminDayDate" type="date">

        <label for="adminStartTime">Startuur</label>
        <input id="adminStartTime" type="time">

        <label for="adminEndTime">Einduur</label>
        <input id="adminEndTime" type="time">

        <label for="adminLocation">Locatie</label>
        <input id="adminLocation" type="text" placeholder="Bijv. De Achelse Kluis">

        <label for="adminCapacity">Totale capaciteit</label>
        <input id="adminCapacity" type="number" min="0" value="0">

        <label for="adminDayStatus">Status</label>
        <select id="adminDayStatus">
          <option value="open" selected>Open</option>
          <option value="draft">Concept</option>
          <option value="full">Volzet</option>
          <option value="closed">Afgesloten</option>
          <option value="cancelled">Geannuleerd</option>
        </select>

        <label for="adminDescription">Beschrijving</label>
        <textarea id="adminDescription" placeholder="Optioneel"></textarea>

        <button id="adminCreateDayButton" class="b2b-submit" type="button" onclick="createB2BDay()">
          B2B-dag aanmaken
        </button>

        <div id="adminCreateDayMessage" class="status-message" hidden></div>
      </section>

      <section style="margin-top:28px;">
        <h3 class="page-section-title">Bestaande B2B-dagen</h3>
        <div id="adminB2BDaysList">
          <div class="status-message">B2B-dagen laden...</div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="./b2b.js"></script>
</body>
</html>
