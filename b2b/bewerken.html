<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17130f">

  <title>Achel B2B - Inschrijving wijzigen</title>

  <link rel="stylesheet" href="./b2b.css">

  <style>
    .phone-field-group { display: flex; gap: 8px; align-items: stretch; }
    .phone-field-group .phone-country-select { flex: 0 0 auto; width: auto; }
    .phone-field-group input { flex: 1 1 auto; min-width: 0; }
  </style>
</head>

<body>

  <div class="b2b-app">

    <header class="b2b-header">

      <a
        href="./mijn-inschrijvingen.html"
        class="back-button"
        aria-label="Terug"
      >
        ←
      </a>

      <div class="header-text">
        <span class="header-eyebrow">Achelse Kluis</span>
        <h1>Inschrijving wijzigen</h1>
      </div>

    </header>


    <main class="b2b-main">

      <section class="welcome-section">

        <p class="welcome-label">
          B2B
        </p>

        <h2 id="editRegistrationTitle">
          Inschrijving laden...
        </h2>

        <p
          id="editRegistrationDay"
          class="welcome-description"
        ></p>

      </section>


      <section class="quota-block">

        <div class="quota-head">

          <span>
            Beschikbare plaatsen
          </span>

          <strong id="editQuotaText">
            —
          </strong>

        </div>

        <div class="quota-progress">

          <span
            id="editQuotaProgress"
            style="width:0%"
          ></span>

        </div>

      </section>


      <section class="b2b-form-card">

        <label for="editCompanyName">
          Bedrijfsnaam / horecazaak
        </label>

        <input
          id="editCompanyName"
          type="text"
        >


        <label for="editContactFirstName">
          Voornaam contactpersoon
        </label>

        <input
          id="editContactFirstName"
          type="text"
          autocomplete="given-name"
          required
        >


        <label for="editContactLastName">
          Achternaam contactpersoon
        </label>

        <input
          id="editContactLastName"
          type="text"
          autocomplete="family-name"
          required
        >


        <label for="editCustomerEmail">
          E-mailadres
        </label>

        <input
          id="editCustomerEmail"
          type="email"
          required
          pattern="[^\s@]+@[^\s@]+\.(com|be|nl)"
        >


        <label for="editCustomerPhoneNumber">
          Telefoon
        </label>

        <div class="phone-field-group">
          <select id="editCustomerPhoneCountry" class="phone-country-select" aria-label="Landcode">
            <option value="+32">🇧🇪 +32</option>
            <option value="+31">🇳🇱 +31</option>
          </select>
          <input
            id="editCustomerPhoneNumber"
            type="tel"
            autocomplete="tel-national"
            required
            inputmode="numeric"
          >
        </div>


        <label>
          Aantal personen
        </label>

        <div class="guest-selector">

          <button
            type="button"
            onclick="changeEditGuestCount(-1)"
          >
            −
          </button>

          <strong id="editGuestCountDisplay">
            1
          </strong>

          <button
            type="button"
            onclick="changeEditGuestCount(1)"
          >
            +
          </button>

        </div>

        <input
          id="editGuestCount"
          type="hidden"
          value="1"
        >


        <label for="editRegistrationNotes">
          Opmerking
        </label>

        <textarea
          id="editRegistrationNotes"
        ></textarea>


        <button
          id="editRegistrationSaveButton"
          class="b2b-submit"
          type="button"
          onclick="saveB2BRegistrationChanges()"
        >
          Wijzigingen opslaan
        </button>


        <div
          id="editRegistrationStatus"
          class="status-message"
          hidden
        ></div>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./b2b.js"></script>

</body>
</html>
