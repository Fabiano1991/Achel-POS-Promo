<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17130f">

  <title>Achel B2B - Inschrijving wijzigen</title>

  <link rel="stylesheet" href="./b2b.css">

  <style>
    .phone-field-group { display: flex; gap: 8px; align-items: stretch; }
    .phone-field-group .phone-country-select { flex: 0 0 auto; width: auto; }
    .phone-field-group input { flex: 1 1 auto; min-width: 0; }

    /* ===== Overnachting ===== */
    .overnight-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; cursor: pointer; }
    .overnight-toggle-text { font-size: 15px; }
    .overnight-switch { position: relative; flex: 0 0 auto; width: 50px; height: 28px; }
    .overnight-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .overnight-slider { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.18); transition: background .2s; }
    .overnight-slider::before { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .overnight-switch input:checked + .overnight-slider { background: #3fae5a; }
    .overnight-switch input:checked + .overnight-slider::before { transform: translateX(22px); }
    .overnight-switch input:focus-visible + .overnight-slider { outline: 2px solid #3fae5a; outline-offset: 2px; }
    .overnight-panel { margin-top: 10px; padding: 4px 16px 16px; border: 1px solid rgba(201,162,77,.28); border-radius: 14px; background: rgba(201,162,77,.06); }
    .overnight-panel[hidden] { display: none; }
    .overnight-nights { margin-top: 12px; font-size: 14px; opacity: .85; }
  </style>
</head>

<body>

  <div class="b2b-app">

    <header class="b2b-header">

      <a
        href="./mijn-inschrijvingen.html"
        class="back-button"
        aria-label="Terug"
      >
        ←
      </a>

      <div class="header-text">
        <span class="header-eyebrow">Achelse Kluis</span>
        <h1>Inschrijving wijzigen</h1>
      </div>

    </header>


    <main class="b2b-main">

      <section class="welcome-section">

        <p class="welcome-label">
          B2B
        </p>

        <h2 id="editRegistrationTitle">
          Inschrijving laden...
        </h2>

        <p
          id="editRegistrationDay"
          class="welcome-description"
        ></p>

      </section>


      <section class="quota-block">

        <div class="quota-head">

          <span>
            Beschikbare plaatsen
          </span>

          <strong id="editQuotaText">
            —
          </strong>

        </div>

        <div class="quota-progress">

          <span
            id="editQuotaProgress"
            style="width:0%"
          ></span>

        </div>

      </section>


      <section class="b2b-form-card">

        <label for="editCompanyName">
          Bedrijfsnaam / horecazaak
        </label>

        <input
          id="editCompanyName"
          type="text"
        >


        <label for="editContactFirstName">
          Voornaam contactpersoon
        </label>

        <input
          id="editContactFirstName"
          type="text"
          autocomplete="given-name"
          required
        >


        <label for="editContactLastName">
          Achternaam contactpersoon
        </label>

        <input
          id="editContactLastName"
          type="text"
          autocomplete="family-name"
          required
        >


        <label for="editCustomerEmail">
          E-mailadres
        </label>

        <input
          id="editCustomerEmail"
          type="email"
          required
          pattern="[^\s@]+@[^\s@]+\.(com|be|nl)"
        >


        <label for="editCustomerPhoneNumber">
          Telefoon
        </label>

        <div class="phone-field-group">
          <select id="editCustomerPhoneCountry" class="phone-country-select" aria-label="Landcode">
            <option value="+32">🇧🇪 +32</option>
            <option value="+31">🇳🇱 +31</option>
          </select>
          <input
            id="editCustomerPhoneNumber"
            type="tel"
            autocomplete="tel-national"
            required
            inputmode="numeric"
          >
        </div>


        <label>
          Aantal personen
        </label>

        <div class="guest-selector">

          <button
            type="button"
            onclick="changeEditGuestCount(-1)"
          >
            −
          </button>

          <strong id="editGuestCountDisplay">
            1
          </strong>

          <button
            type="button"
            onclick="changeEditGuestCount(1)"
          >
            +
          </button>

        </div>

        <input
          id="editGuestCount"
          type="hidden"
          value="1"
        >


        <!-- ===== OVERNACHTING ===== -->
        <label class="overnight-toggle" for="editOvernightToggle">
          <span class="overnight-toggle-text">Overnachting</span>
          <span class="overnight-switch">
            <input id="editOvernightToggle" type="checkbox" onchange="toggleOvernightPanel('edit')">
            <span class="overnight-slider"></span>
          </span>
        </label>

        <div id="editOvernightPanel" class="overnight-panel" hidden>
          <p class="overnight-nights">Overnachting: <strong>1 nacht</strong></p>

          <label>Aantal personen dat blijft slapen</label>
          <div class="guest-selector">
            <button type="button" onclick="changeOvernightGuests('edit', -1)">−</button>
            <strong id="editOvernightGuestsDisplay">1</strong>
            <button type="button" onclick="changeOvernightGuests('edit', 1)">+</button>
          </div>
          <input id="editOvernightGuests" type="hidden" value="1">

          <label for="editOvernightRoom">Kamerwens</label>
          <select id="editOvernightRoom">
            <option value="">Geen voorkeur</option>
            <option value="1-persoonskamer">1-persoonskamer</option>
            <option value="2-persoonskamer">2-persoonskamer</option>
            <option value="2-persoonskamer (aparte bedden)">2-persoonskamer (aparte bedden)</option>
          </select>

          <!-- Plaats voor later: akkoord met reglement / contract -->
        </div>


        <label for="editRegistrationNotes">
          Opmerking
        </label>

        <textarea
          id="editRegistrationNotes"
        ></textarea>


        <button
          id="editRegistrationSaveButton"
          class="b2b-submit"
          type="button"
          onclick="saveB2BRegistrationChanges()"
        >
          Wijzigingen opslaan
        </button>


        <div
          id="editRegistrationStatus"
          class="status-message"
          hidden
        ></div>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./b2b.js"></script>

</body>
</html>
