<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17130f">

  <title>Achel B2B-dagen</title>

  <link rel="stylesheet" href="./b2b.css">
</head>

<body>

  <div class="b2b-app">

    <header class="b2b-header">

      <a
        href="./index.html"
        class="back-button"
        aria-label="Terug"
      >
        ←
      </a>

      <div class="header-text">
        <span class="header-eyebrow">Achelse Kluis</span>
        <h1>B2B-dagen</h1>
      </div>

    </header>


    <main class="b2b-main">

      <section class="welcome-section">

        <p class="welcome-label">
          Planning
        </p>

        <h2>
          Beschikbare B2B-dagen
        </h2>

        <p class="welcome-description">
          Bekijk je beschikbare B2B-dagen en hoeveel plaatsen je nog kunt gebruiken.
        </p>

      </section>


      <section id="b2bDaysList">

        <div class="status-message">
          B2B-dagen laden...
        </div>

      </section>


      <div
        id="b2bDaysStatus"
        class="status-message"
        hidden
      ></div>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./b2b.js"></script>

</body>
</html>
