<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#17130f">
  <title>Achel B2B - Nieuwe inschrijving</title>

  <link rel="stylesheet" href="./b2b.css">
</head>

<body>

  <div class="b2b-app">

    <header class="b2b-header">

      <a
        href="./dagen.html"
        class="back-button"
        aria-label="Terug"
      >
        ←
      </a>

      <div class="header-text">
        <span class="header-eyebrow">Achelse Kluis</span>
        <h1>Nieuwe inschrijving</h1>
      </div>

    </header>


    <main class="b2b-main">

      <section class="welcome-section">

        <p class="welcome-label">
          Klant inschrijven
        </p>

        <h2 id="registrationDayTitle">
          B2B-dag laden...
        </h2>

        <p
          id="registrationDayMeta"
          class="welcome-description"
        ></p>

      </section>


      <section
        id="registrationQuotaCard"
        class="quota-block"
      >

        <div class="quota-head">

          <span>
            Jouw beschikbare plaatsen
          </span>

          <strong id="registrationQuotaText">
            —
          </strong>

        </div>

        <div class="quota-progress">

          <span
            id="registrationQuotaProgress"
            style="width:0%"
          ></span>

        </div>

      </section>


      <section class="b2b-form-card">

        <label for="companyName">
          Bedrijfsnaam / horecazaak
        </label>

        <input
          id="companyName"
          type="text"
          placeholder="Bijv. Café De Markt"
          autocomplete="organization"
        >


        <label for="contactName">
          Contactpersoon
        </label>

        <input
          id="contactName"
          type="text"
          placeholder="Voornaam en naam"
          autocomplete="name"
        >


        <label for="customerEmail">
          E-mailadres
        </label>

        <input
          id="customerEmail"
          type="email"
          placeholder="naam@bedrijf.be"
          autocomplete="email"
        >


        <label for="customerPhone">
          Telefoon
        </label>

        <input
          id="customerPhone"
          type="tel"
          placeholder="+32 ..."
          autocomplete="tel"
        >


        <label for="guestCount">
          Aantal personen
        </label>

        <div class="guest-selector">

          <button
            type="button"
            onclick="changeGuestCount(-1)"
          >
            −
          </button>

          <strong id="guestCountDisplay">
            1
          </strong>

          <button
            type="button"
            onclick="changeGuestCount(1)"
          >
            +
          </button>

        </div>

        <input
          id="guestCount"
          type="hidden"
          value="1"
        >


        <label for="registrationNotes">
          Opmerking
        </label>

        <textarea
          id="registrationNotes"
          placeholder="Optioneel"
        ></textarea>


        <button
          id="registrationSubmitButton"
          class="b2b-submit"
          type="button"
          onclick="submitB2BRegistration()"
        >
          Klant inschrijven
        </button>


        <div
          id="registrationStatus"
          class="status-message"
          hidden
        ></div>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./b2b.js"></script>

</body>
</html>
