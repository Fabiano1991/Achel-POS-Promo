<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17130f">
  <title>Achel B2B - Nieuwe inschrijving</title><link rel="stylesheet" href="./b2b.css">
  <style>
    .phone-field-group { display: flex; gap: 8px; align-items: stretch; }
    .phone-field-group .phone-country-select { flex: 0 0 auto; width: auto; }
    .phone-field-group input { flex: 1 1 auto; min-width: 0; }

    /* ===== Overnachting ===== */
    .overnight-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding: 14px 16px; border: 1px solid rgba(201,162,77,.28); border-radius: 14px; background: rgba(255,255,255,.03); cursor: pointer; }
    .overnight-toggle-text { display: flex; flex-direction: column; gap: 2px; }
    .overnight-toggle-text strong { font-size: 15px; }
    .overnight-toggle-text small { opacity: .7; font-size: 12px; }
    .overnight-switch { position: relative; flex: 0 0 auto; width: 50px; height: 28px; }
    .overnight-switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .overnight-slider { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.18); transition: background .2s; }
    .overnight-slider::before { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .2s; }
    .overnight-switch input:checked + .overnight-slider { background: #c9a24d; }
    .overnight-switch input:checked + .overnight-slider::before { transform: translateX(22px); }
    .overnight-switch input:focus-visible + .overnight-slider { outline: 2px solid #c9a24d; outline-offset: 2px; }
    .overnight-panel { margin-top: 10px; padding: 4px 16px 16px; border: 1px solid rgba(201,162,77,.28); border-radius: 14px; background: rgba(201,162,77,.06); }
    .overnight-panel[hidden] { display: none; }
    .overnight-nights { margin-top: 12px; font-size: 14px; opacity: .85; }
  </style>
</head>
<body>
  <div class="b2b-app">
    <header class="b2b-header"><a href="./dagen.html" class="back-button" aria-label="Terug">←</a><div class="header-text"><span class="header-eyebrow">Achelse Kluis</span><h1>Nieuwe inschrijving</h1></div></header>
    <main class="b2b-main">
      <section class="welcome-section"><p class="welcome-label">Klant inschrijven</p><h2 id="registrationDayTitle">B2B-dag laden...</h2><p id="registrationDayMeta" class="welcome-description"></p></section>
      <section id="registrationQuotaCard" class="quota-block"><div class="quota-head"><span>Jouw beschikbare plaatsen</span><strong id="registrationQuotaText">—</strong></div><div class="quota-progress"><span id="registrationQuotaProgress" style="width:0%"></span></div></section>
      <section class="b2b-form-card">
        <label for="companyName">Bedrijfsnaam / horecazaak</label><input id="companyName" type="text" placeholder="Bijv. Café De Markt" autocomplete="organization">

        <label for="contactFirstName">Voornaam contactpersoon</label><input id="contactFirstName" type="text" placeholder="Voornaam" autocomplete="given-name" required>

        <label for="contactLastName">Achternaam contactpersoon</label><input id="contactLastName" type="text" placeholder="Achternaam" autocomplete="family-name" required>

        <label for="customerEmail">E-mailadres</label><input id="customerEmail" type="email" placeholder="naam@bedrijf.be" autocomplete="email" required pattern="[^\s@]+@[^\s@]+\.(com|be|nl)">

        <label for="customerPhoneNumber">Telefoon</label>
        <div class="phone-field-group">
          <select id="customerPhoneCountry" class="phone-country-select" aria-label="Landcode">
            <option value="+32">🇧🇪 +32</option>
            <option value="+31">🇳🇱 +31</option>
          </select>
          <input id="customerPhoneNumber" type="tel" placeholder="470 12 34 56" autocomplete="tel-national" required inputmode="numeric">
        </div>

        <label for="guestCount">Aantal personen</label><div class="guest-selector"><button type="button" onclick="changeGuestCount(-1)">−</button><strong id="guestCountDisplay">1</strong><button type="button" onclick="changeGuestCount(1)">+</button></div><input id="guestCount" type="hidden" value="1">
        <!-- ===== OVERNACHTING ===== -->
        <label class="overnight-toggle" for="overnightToggle">
          <span class="overnight-toggle-text">
            <strong>Blijven overnachten?</strong>
            <small>Zet aan als (een deel van) de groep blijft slapen</small>
          </span>
          <span class="overnight-switch">
            <input id="overnightToggle" type="checkbox" onchange="toggleOvernightPanel('')">
            <span class="overnight-slider"></span>
          </span>
        </label>

        <div id="overnightPanel" class="overnight-panel" hidden>
          <p class="overnight-nights">Overnachting: <strong>1 nacht</strong></p>

          <label>Aantal personen dat blijft slapen</label>
          <div class="guest-selector">
            <button type="button" onclick="changeOvernightGuests('', -1)">−</button>
            <strong id="overnightGuestsDisplay">1</strong>
            <button type="button" onclick="changeOvernightGuests('', 1)">+</button>
          </div>
          <input id="overnightGuests" type="hidden" value="1">

          <label for="overnightRoom">Kamerwens</label>
          <select id="overnightRoom">
            <option value="">Geen voorkeur</option>
            <option value="1-persoonskamer">1-persoonskamer</option>
            <option value="2-persoonskamer">2-persoonskamer</option>
            <option value="2-persoonskamer (aparte bedden)">2-persoonskamer (aparte bedden)</option>
          </select>

          <label for="overnightNotes">Opmerking overnachting</label>
          <textarea id="overnightNotes" placeholder="Bijv. late aankomst (geen dieetwensen)"></textarea>

          <!-- Plaats voor later: akkoord met reglement / contract -->
        </div>

        <label for="registrationNotes">Opmerking</label><textarea id="registrationNotes" placeholder="Optioneel"></textarea>
        <button id="registrationSubmitButton" class="b2b-submit" type="button" onclick="submitB2BRegistration()">Klant inschrijven</button>
        <div id="registrationStatus" class="status-message" hidden></div>
      </section>
    </main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./b2b.js"></script>
</body>
</html>
