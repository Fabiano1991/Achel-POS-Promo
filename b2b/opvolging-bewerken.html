<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17130f">
  <title>Achel B2B - Opvolging</title>
  <link rel="stylesheet" href="./b2b.css">
</head>
<body>
<div class="b2b-app">
  <header class="b2b-header">
    <a href="./opvolging.html" class="back-button" aria-label="Terug">←</a>
    <div class="header-text"><span class="header-eyebrow">Achelse Kluis</span><h1>Opvolging</h1></div>
  </header>
  <main class="b2b-main">
    <section class="welcome-section"><p class="welcome-label">Commerciële fiche</p></section>

    <section class="followup-customer-card">
      <div class="followup-customer-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.7-4 3.1-6 7-6s6.3 2 7 6"></path></svg></div>
      <div class="followup-customer-copy"><h2 id="followupEditCompany">Klant laden...</h2><p id="followupEditMeta"></p></div>
    </section>

    <section class="followup-section">
      <h3 class="followup-section-title">Commerciële status</h3>
      <select id="followupEditStatus" class="followup-native-control" tabindex="-1" aria-hidden="true">
        <option value="to_follow_up">Te contacteren</option><option value="contacted">Gecontacteerd</option><option value="interested">Interesse</option><option value="trial_or_offer">Proef / voorstel</option><option value="customer">Klant geworden</option><option value="not_interested">Geen interesse</option>
      </select>
      <div class="followup-option-grid">
        <button type="button" class="followup-status-button" data-followup-status="to_follow_up" onclick="selectB2BFollowupStatus('to_follow_up')">Te contacteren</button>
        <button type="button" class="followup-status-button" data-followup-status="contacted" onclick="selectB2BFollowupStatus('contacted')">Gecontacteerd</button>
        <button type="button" class="followup-status-button" data-followup-status="interested" onclick="selectB2BFollowupStatus('interested')">Interesse</button>
        <button type="button" class="followup-status-button" data-followup-status="trial_or_offer" onclick="selectB2BFollowupStatus('trial_or_offer')">Proef / voorstel</button>
        <button type="button" class="followup-status-button" data-followup-status="customer" onclick="selectB2BFollowupStatus('customer')">Klant geworden</button>
        <button type="button" class="followup-status-button" data-followup-status="not_interested" onclick="selectB2BFollowupStatus('not_interested')">Geen interesse</button>
      </div>
    </section>

    <section class="followup-section">
      <h3 class="followup-section-title">Interesse in producten</h3>
      <input id="followupEditProducts" class="followup-native-control" type="text" tabindex="-1" aria-hidden="true">
      <div class="followup-product-grid">
        <button type="button" class="followup-product-chip" data-followup-product="Tripel" onclick="toggleB2BFollowupProduct('Tripel')">Tripel</button>
        <button type="button" class="followup-product-chip" data-followup-product="Dubbel" onclick="toggleB2BFollowupProduct('Dubbel')">Dubbel</button>
        <button type="button" class="followup-product-chip" data-followup-product="Gallant" onclick="toggleB2BFollowupProduct('Gallant')">Gallant</button>
        <button type="button" class="followup-product-chip" data-followup-product="Single" onclick="toggleB2BFollowupProduct('Single')">Single</button>
        <button type="button" class="followup-product-chip" data-followup-product="Rouge" onclick="toggleB2BFollowupProduct('Rouge')">Rouge</button>
      </div>
    </section>

    <section class="followup-section">
      <h3 class="followup-section-title">Vervolg</h3>
      <div class="followup-control-card"><span class="followup-control-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg></span><label for="followupEditNextAction">Volgende actie</label><input id="followupEditNextAction" class="followup-control-input" type="text" placeholder="Bijv. proefvat voorstellen"></div>
      <div class="followup-control-card"><span class="followup-control-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M8 3v4M16 3v4M4 10h16"></path></svg></span><label for="followupEditDate">Opvolgdatum</label><input id="followupEditDate" class="followup-control-input" type="date"></div>
      <details class="followup-note-details"><summary>Notitie toevoegen</summary><textarea id="followupEditNote" placeholder="Wat werd besproken?"></textarea></details>
      <button id="followupEditSaveButton" class="b2b-submit" type="button" onclick="saveB2BFollowup()">Opvolging opslaan</button>
      <div id="followupEditMessage" class="status-message" hidden></div>
    </section>
  </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./b2b.js"></script>
</body>
</html>
