<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta name="theme-color" content="#17130f">

  <title>Achel B2B - Opvolging</title>

  <link rel="stylesheet" href="./b2b.css">
</head>

<body>

  <div class="b2b-app">

    <header class="b2b-header">

      <a
        href="./opvolging.html"
        class="back-button"
        aria-label="Terug"
      >
        ←
      </a>

      <div class="header-text">
        <span class="header-eyebrow">Achelse Kluis</span>
        <h1>Opvolging</h1>
      </div>

    </header>


    <main class="b2b-main">

      <section class="welcome-section">

        <p class="welcome-label">
          Commerciële fiche
        </p>

        <h2 id="followupEditCompany">
          Klant laden...
        </h2>

        <p
          id="followupEditMeta"
          class="welcome-description"
        ></p>

      </section>


      <section class="b2b-form-card">

        <label for="followupEditStatus">
          Commerciële status
        </label>

        <select id="followupEditStatus">

          <option value="to_follow_up">
            Nog opvolgen
          </option>

          <option value="contacted">
            Gecontacteerd
          </option>

          <option value="interested">
            Interesse
          </option>

          <option value="trial_or_offer">
            Proef / voorstel
          </option>

          <option value="customer">
            Klant geworden
          </option>

          <option value="not_interested">
            Geen interesse
          </option>

        </select>


        <label for="followupEditProducts">
          Interesse in producten
        </label>

        <input
          id="followupEditProducts"
          type="text"
          placeholder="Bijv. Tripel vat, Gallant, POS"
        >


        <label for="followupEditNote">
          Commerciële notitie
        </label>

        <textarea
          id="followupEditNote"
          placeholder="Wat werd besproken?"
        ></textarea>


        <label for="followupEditNextAction">
          Volgende actie
        </label>

        <input
          id="followupEditNextAction"
          type="text"
          placeholder="Bijv. proefvat voorstellen"
        >


        <label for="followupEditDate">
          Opvolgdatum
        </label>

        <input
          id="followupEditDate"
          type="date"
        >


        <button
          id="followupEditSaveButton"
          class="b2b-submit"
          type="button"
          onclick="saveB2BFollowup()"
        >
          Opvolging opslaan
        </button>


        <div
          id="followupEditMessage"
          class="status-message"
          hidden
        ></div>

      </section>

    </main>

  </div>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./b2b.js"></script>

</body>
</html>
