<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<meta name="theme-color" content="#1e2c27">
<title>Achel | Verkoop</title>
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../achel-icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* Plan: donkere kopbalk + tabbalk, daaronder één werkkolom (max 1240px); amber = bier/accent, groen-grijze neutralen */
  --bg:#eef0ed; --surface:#ffffff; --sunk:#e5e8e4; --ink:#1a211f; --muted:#5a6561; --line:#d5dbd7;
  --accent:#a8650f; --accent-strong:#8a520a; --accent-soft:#f5e6cc; --on-accent:#ffffff;
  --deep:#1e2c27; --deep-ink:#f1ede4; --deep-muted:#a9b6b0;
  --good:#2b7448; --good-soft:#d8eedf; --warn:#8f5400; --warn-soft:#fbe7c4; --bad:#b42318; --bad-soft:#fadcd8; --info:#2d4b80; --info-soft:#e0e7f3;
  --display:"IBM Plex Sans Condensed","Arial Narrow",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:8px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111614; --surface:#19201d; --sunk:#141a17; --ink:#e6ebe8; --muted:#97a39e; --line:#2b3531;
    --accent:#e09a3c; --accent-strong:#f0b25c; --accent-soft:#3a2c17; --on-accent:#1a1206;
    --deep:#0c110f; --deep-ink:#efe9de; --deep-muted:#8f9c96;
    --good:#6cc18c; --good-soft:#1c3326; --warn:#e9b05a; --warn-soft:#3a2b12; --bad:#f08a7e; --bad-soft:#3d1f1b; --info:#9db7e6; --info-soft:#1d2738;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111614; --surface:#19201d; --sunk:#141a17; --ink:#e6ebe8; --muted:#97a39e; --line:#2b3531;
  --accent:#e09a3c; --accent-strong:#f0b25c; --accent-soft:#3a2c17; --on-accent:#1a1206;
  --deep:#0c110f; --deep-ink:#efe9de; --deep-muted:#8f9c96;
  --good:#6cc18c; --good-soft:#1c3326; --warn:#e9b05a; --warn-soft:#3a2b12; --bad:#f08a7e; --bad-soft:#3d1f1b; --info:#9db7e6; --info-soft:#1d2738;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;overflow-x:clip;max-width:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:.005em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,td.n,th.n{font-variant-numeric:tabular-nums}

/* Kop */
.top{background:var(--deep);color:var(--deep-ink)}
.top-in{max-width:1240px;margin:0 auto;padding:14px 20px 0;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:0}
.brand h1{font-size:22px;font-weight:700}
.brand span{font-size:13px;color:var(--deep-muted)}
.sync{margin-left:auto;font-size:12.5px;display:flex;align-items:center;gap:6px;color:var(--deep-muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--deep-muted);display:inline-block}
.sync.online i{background:#6cc18c}.sync.local i{background:#e9b05a}
.tabs{max-width:1240px;margin:0 auto;padding:10px 12px 0;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;color:var(--deep-muted);padding:9px 12px 11px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-weight:500;font-size:14px;position:relative}
.tab:hover{color:var(--deep-ink)}
.tab[aria-current="page"]{background:var(--bg);color:var(--ink)}
.tab b{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--bad);color:#fff;font-size:11.5px;line-height:18px;text-align:center}

main{max-width:1240px;margin:0 auto;padding:18px 20px 60px;display:flex;flex-direction:column;gap:18px}
.head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head h2{font-size:24px}
.head p{margin:2px 0 0;color:var(--muted);font-size:14px;max-width:70ch}
.head .actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:var(--r);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong)}
.btn.ghost{background:transparent}
.btn.small{padding:4px 9px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger[data-armed="1"]{background:var(--bad);color:#fff}
.icon{border:0;background:none;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.link{border:0;background:none;color:var(--accent-strong);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:2px;font-weight:500;text-align:left}

/* Filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.filters label{display:flex;flex-direction:column;font-size:12px;color:var(--muted);gap:3px}
.filters select,.filters input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:6px 8px;min-width:130px;font-size:14px}
.filters input[type=search]{min-width:180px}
.filters .btn{align-self:flex-end}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.fbar{display:flex;gap:8px;flex-wrap:wrap}
.fsearch{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:9px 12px;font-size:15px}
.fsel{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:8px 10px;font-size:14px}
.chiprow{display:flex;gap:6px;overflow-x:auto;white-space:nowrap;padding:2px 0 4px;margin-top:-8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chiprow::-webkit-scrollbar{display:none}
.fchip{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:6px 12px;font-size:13px;cursor:pointer}
.fchip.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.fchip.wis{border-style:dashed;color:var(--muted)}
.fsep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.acc>.acc-h:first-child{border-radius:var(--r) var(--r) 0 0}
.acc-h[aria-expanded="true"]{position:sticky;top:0;z-index:3;background:var(--surface);box-shadow:0 1px 0 var(--line)}
.acc-g[aria-expanded="true"]{position:sticky;top:44px;z-index:2;background:var(--sunk)}
.acc-h{display:flex;width:100%;min-height:44px;align-items:center;gap:10px;border:0;background:none;padding:11px 14px;font-size:14.5px;cursor:pointer;text-align:left;color:var(--ink)}
.acc-h+.acc-h,.acc-b+.acc-h{border-top:1px solid var(--line)}
.acc-h .pijl{width:12px;color:var(--muted);flex:none}
.acc-h b{font-weight:600;flex:1;min-width:0}
.acc-h .tel{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.acc-b{border-top:1px solid var(--line)}
.acc-r{display:flex;width:100%;gap:10px;align-items:center;border:0;background:none;padding:9px 14px 9px 36px;font-size:14px;text-align:left;cursor:pointer;color:var(--ink)}
.acc-r+.acc-r{border-top:1px solid var(--line)}
.acc-r:hover,.acc-h:hover{background:var(--sunk)}
.acc-r .nm{flex:1;min-width:0}
.acc-r .nm strong{font-weight:500}
.acc-g .pijl{width:12px;color:var(--muted);flex:none}
.acc-r2{padding-left:52px}
.acc-r .tel{color:var(--muted);font-size:13px;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.active-filter{outline:2px solid var(--accent);outline-offset:-1px}

/* Tegels */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(230px,100%),1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.tile h3{font-family:var(--body);font-size:13px;font-weight:500;color:var(--muted)}
.big{font-family:var(--display);font-size:34px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.big small{font-size:16px;color:var(--muted);font-weight:500}
.tile p{margin:0;font-size:13px;color:var(--muted)}
.tile p strong{color:var(--ink)}
.bar{height:9px;background:var(--sunk);border-radius:5px;overflow:hidden;position:relative}
.bar span{display:block;height:100%;background:var(--accent);border-radius:5px}
.bar.done span{background:var(--good)}
.bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.55}
.minirow{display:flex;gap:18px;flex-wrap:wrap}
.minirow div{display:flex;flex-direction:column}
.minirow .big{font-size:28px}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.panel-h h3{font-size:17px}
.panel-h p{margin:0;color:var(--muted);font-size:13px}
.panel-h .sp{flex:1}
.note{font-size:13px;color:var(--muted);margin:0}
.note.warn{background:var(--warn-soft);color:var(--ink);border-radius:6px;padding:8px 10px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font:11px var(--body)}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .barv{fill:var(--accent);opacity:.55}
svg.chart .barv.cur{opacity:1}
svg.chart .barv.ok{fill:var(--good);opacity:.8}
svg.chart .goal{stroke:var(--ink);stroke-dasharray:5 4;stroke-width:1.5;fill:none;opacity:.7}
svg.chart .goal2{stroke:var(--muted);stroke-dasharray:2 4;stroke-width:1.5;fill:none}
svg.chart .act{stroke:var(--accent);stroke-width:2.5;fill:none}
svg.chart .area{fill:var(--accent);opacity:.12}
svg.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
svg.chart .val{fill:var(--ink);font-weight:600}
svg.chart .lbl{fill:var(--ink)}

/* Tabellen */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;color:var(--muted);font-size:12.5px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--sunk);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}
td.n,th.n{text-align:right}
td.wrap{max-width:320px}
tfoot td{font-weight:600;background:var(--sunk)}
.sub{color:var(--muted);font-size:12.5px;display:block}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:10px}

.chip{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--sunk);color:var(--ink)}
.st-prospect{background:var(--info-soft);color:var(--info)}
.st-gesprek{background:var(--accent-soft);color:var(--accent-strong)}
.st-proef{background:var(--warn-soft);color:var(--warn)}
.st-klant{background:var(--good-soft);color:var(--good)}
.st-pauze{background:var(--sunk);color:var(--muted)}
.st-verloren{background:var(--bad-soft);color:var(--bad)}
.pot{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;font-weight:700;font-size:12px;font-family:var(--display);border:1.5px solid var(--line);color:var(--muted)}
.pot.A{border-color:var(--accent);background:var(--accent);color:var(--on-accent)}
.pot.B{border-color:var(--accent);color:var(--accent-strong)}
.late{color:var(--bad);font-weight:600}
.soon{color:var(--warn);font-weight:600}
.ex{font-size:11px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}

/* Pipeline */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(230px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-height:120px}
.col h3{font-size:15px;display:flex;justify-content:space-between;align-items:center}
.col h3 small{font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.card .t{display:flex;gap:8px;align-items:flex-start}
.card .t button{flex:1}
.card .meta{color:var(--muted);font-size:12.5px}
.card .mv{display:flex;gap:6px;justify-content:space-between;margin-top:2px}

/* Lijst opvolging */
.flist{display:flex;flex-direction:column;gap:8px}
.fitem{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center}
.fitem.late{border-left-color:var(--bad)}
.fitem.today{border-left-color:var(--accent)}
.fitem .acts{display:flex;gap:6px;grid-row:span 2}
.fitem .what{font-weight:500;color:var(--ink)}
.fitem .who{font-size:13px;color:var(--muted)}
.fgroup h3{font-size:16px;margin:4px 0 8px}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(320px,100%),1fr));gap:12px}
.acard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.acard header{display:flex;gap:8px;align-items:flex-start}
.acard header h3{font-size:17px;flex:1}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.inline{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.inline select,.inline input{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 7px;font-size:13.5px}
.inline input[type=number]{width:80px}

/* Rekenmodule */
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(320px,100%),1fr));gap:12px}
.calc .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.calc label{display:flex;flex-direction:column;font-size:12.5px;color:var(--muted);gap:3px}
.calc input,.calc select{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;font-size:15px;min-width:0}
.calc input[type=number]{width:120px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px}
.res div{background:var(--sunk);border-radius:6px;padding:8px 10px}
.res b{display:block;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.res span{font-size:12px;color:var(--muted)}

/* Instellingen */
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px 14px}
.fld{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);min-width:0}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:7px 9px;font-size:15px;color:var(--ink);width:100%}
.fld textarea{min-height:76px;resize:vertical}
.fld.full{grid-column:1/-1}
.fld small{color:var(--muted);font-size:12px}
.sect{grid-column:1/-1;font-family:var(--display);font-size:15px;color:var(--ink);font-weight:600;margin-top:6px;padding-top:8px;border-top:1px solid var(--line)}

/* Venster */
.modal{position:fixed;inset:0;background:rgba(10,14,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 12px;z-index:20;overflow-y:auto}
.modal[hidden]{display:none}
.dlg{background:var(--surface);border-radius:12px;width:min(820px,100%);box-shadow:0 18px 50px rgba(0,0,0,.3);border:1px solid var(--line)}
.dlg header{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg header h2{font-size:20px;flex:1}
.dlg-body{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dlg footer{display:flex;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.dlg footer .sp{flex:1}
.ag-dagen{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.ag-dag{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:7px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-size:13.5px;font-weight:500;color:var(--ink)}
.ag-dag small{font-size:11.5px;color:var(--muted);font-weight:400}
.ag-dag.vandaag{border-color:var(--accent)}
.ag-dag.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.ag-dag.on small{color:var(--on-accent);opacity:.85}
.ag-wrap{max-height:62vh;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);-webkit-overflow-scrolling:touch}
.ag-grid{display:grid;position:relative}
.ag-uren{position:relative;border-right:1px solid var(--line)}
.ag-uren span{position:absolute;right:6px;transform:translateY(-50%);font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.ag-uren span:first-child{transform:none}
.ag-col{position:relative;border-right:1px solid var(--line);background-image:repeating-linear-gradient(to bottom,var(--line) 0,var(--line) 1px,transparent 1px,transparent 60px),repeating-linear-gradient(to bottom,transparent 0,transparent 30px,var(--sunk) 30px,var(--sunk) 31px,transparent 31px,transparent 60px)}
.ag-col:last-child{border-right:0}
.ag-col.gekozen{background-color:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.ag-blk{position:absolute;background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:0 6px 6px 0;padding:3px 7px 8px;font-size:12.5px;line-height:1.3;color:var(--ink);overflow:hidden;cursor:grab;touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;box-sizing:border-box}
.ag-blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-blk .ag-tijd,.ag-blk .ag-not{display:block;color:var(--muted);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ag-blk.gedaan{background:var(--good-soft);border-left-color:var(--good)}
.ag-blk.drag{box-shadow:0 0 0 2px var(--accent),0 8px 20px rgba(0,0,0,.18);z-index:5;cursor:grabbing;opacity:.95}
.ag-grip{position:absolute;left:0;right:0;bottom:0;height:14px;cursor:ns-resize;touch-action:pan-y}
.ag-grip::after{content:"";position:absolute;left:50%;bottom:3px;width:22px;height:3px;margin-left:-11px;border-radius:2px;background:var(--accent);opacity:.6}
.ag-plan .fsearch{width:100%;flex:none}
.ag-lijst{display:flex;flex-direction:column;max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r)}
.ag-k{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;font-size:14px;cursor:pointer}
.ag-k+.ag-k{border-top:1px solid var(--line)}
.ag-kinfo{display:flex;flex-direction:column;gap:2px;min-width:0}
.ag-krij{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.ag-krij .pot{width:20px;height:20px;font-size:11px}
.ag-k input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent);flex:none}
.ag-knop{display:flex;gap:8px;flex-wrap:wrap;position:sticky;bottom:0;background:var(--surface);padding-top:6px}
.btn[disabled]{opacity:.5;cursor:default}

<body>
<header class="top">
  <div class="top-in">
    <a class="home" href="../index.html" aria-label="Terug naar Achel POS">←</a>
    <div class="brand"><h1>Achel Verkoop</h1><span id="brandSub">Je eigen verkoopoverzicht</span></div>
    <div class="sync" id="sync"><select id="viewSel" class="viewsel" hidden aria-label="Gegevens bekijken van"></select><i></i><span>Gegevens laden…</span></div>
  </div>

<main id="view"></main>
<div class="modal" id="modal" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
(function(){
'use strict';

/* ---------- Hulpfuncties ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(',','.'));return isFinite(n)?n:0};
const fmt=(n,d)=>Number(n||0).toLocaleString('nl-BE',{minimumFractionDigits:d==null?1:d,maximumFractionDigits:d==null?1:d});
const fmt0=n=>Number(n||0).toLocaleString('nl-BE',{maximumFractionDigits:0});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date());
const fdate=s=>{if(!s)return '';const p=String(s).split('-');return p.length===3?p[2]+'/'+p[1]+'/'+p[0].slice(2):esc(s)};
const addDays=(s,n)=>{const d=new Date((s||today())+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const newId=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const byName=(a,b)=>String(a.zaak||'').localeCompare(String(b.zaak||''),'nl');
const MAANDEN=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const MAANDEN_L=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const STATUSSEN=['Prospect','In gesprek','Proef / offerte','Klant','Gepauzeerd','Verloren'];
const STATUS_CLS={'Prospect':'st-prospect','In gesprek':'st-gesprek','Proef / offerte':'st-proef','Klant':'st-klant','Gepauzeerd':'st-pauze','Verloren':'st-verloren'};
const TYPES=['Horeca','Drankenhandel','Retail / supermarkt','Groothandel / verdeler','Evenement / vereniging','Andere'];
const POT=[['A','A – groot potentieel'],['B','B – middel'],['C','C – klein'],['?','Nog onbekend']];
const CONTRACT=['Onbekend','Vrij (geen contract)','Brouwerijcontract','Via verdeler','Eigen invoer / groothandel'];
const SOORT_BEZOEK=['Bezoek','Telefoon','Proeverij','Mail / bericht','Event'];
const COLS=['klanten','bezoeken','bestellingen','acties','seizoensbieren','afspraken'];
const DEFAULTS={
  doelMaand:70, doelJaar:1500,
  regios:[
    {naam:'Noord-Limburg',gemeenten:['Hamont-Achel','Pelt','Lommel','Peer','Hechtel-Eksel','Leopoldsburg','Bocholt','Bree','Kinrooi','Maaseik','Dilsen-Stokkem','Oudsbergen']},
    {naam:'Midden-Limburg',gemeenten:['Hasselt','Genk','Beringen','Heusden-Zolder','Houthalen-Helchteren','Zonhoven','Diepenbeek','Lummen','Halen','Herk-de-Stad','Tessenderlo-Ham','As','Zutendaal']}
  ],
  eenheden:[
    {id:'bak',naam:'Bak 24 × 33 cl',liter:7.92,perPallet:null},
    {id:'vat',naam:'Vat 20 L',liter:20,perPallet:null},
    {id:'fles',naam:'Losse fles 33 cl',liter:0.33,perPallet:null}
  ],
  producten:['Tripel','Dubbel','Singel Blond','Gallant Grand Cru Special']
};

/* ---------- Toestand ---------- */
const S={klanten:[],bezoeken:[],bestellingen:[],acties:[],seizoensbieren:[],afspraken:[],inst:null};
let MODE='laden', db=null;
const TABS=[['dashboard','Dashboard'],['klanten','Klanten'],['prospectie','Prospectie'],['bezoeken','Bezoeken'],['bestellingen','Bestellingen'],['acties','Drankenhandelacties'],['seizoen','Seizoensbieren'],['opvolging','Opvolging'],['agenda','Agenda'],['rekenen','Rekenmodule'],['instellingen','Instellingen']];
const now=new Date();
const UI={
  tab:'dashboard',
  f:{regio:'',gemeente:'',status:'',type:'',q:'',bron:''},
  jaar:String(now.getFullYear()), maand:'', groep:'gemeente', sort:'zaak',
  calc:{eenheid:'bak',aantal:'10',hl:'5',pallets:'1',mix:{}},
  extraEenheden:0, showExport:false
};
const MODAL={onSubmit:null};

function inst(){
  const i=Object.assign({},DEFAULTS,S.inst||{});
  if(!Array.isArray(i.regios)||!i.regios.length)i.regios=DEFAULTS.regios;
  if(!Array.isArray(i.eenheden)||!i.eenheden.length)i.eenheden=DEFAULTS.eenheden;
  if(!Array.isArray(i.producten)||!i.producten.length)i.producten=DEFAULTS.producten;
  return i;
}
const eenheid=id=>inst().eenheden.find(e=>e.id===id)||null;
function regioVan(g){
  if(!g)return '';
  const l=g.trim().toLowerCase();
  const r=inst().regios.find(r=>(r.gemeenten||[]).some(x=>x.toLowerCase()===l));
  return r?r.naam:'';
}
const klantRegio=k=>k.regio||regioVan(k.gemeente)||'Onbekend';
const klantMap=()=>{const m={};S.klanten.forEach(k=>m[k.id]=k);return m};
function laatsteBezoek(k){
  let d=k.laatsteBezoek||'';
  S.bezoeken.forEach(b=>{if(b.klantId===k.id&&b.datum&&b.datum>d)d=b.datum});
  return d;
}
function hlKlantJaar(k,jaar){
  let t=0;S.bestellingen.forEach(o=>{if(o.klantId===k.id&&String(o.datum||'').slice(0,4)===String(jaar))t+=num(o.hl)});return t;
}
function alleGemeenten(regio){
  const set=new Set();
  inst().regios.forEach(r=>{if(!regio||r.naam===regio)(r.gemeenten||[]).forEach(g=>set.add(g))});
  S.klanten.forEach(k=>{if(k.gemeente&&(!regio||klantRegio(k)===regio))set.add(k.gemeente)});
  return [...set].sort((a,b)=>a.localeCompare(b,'nl'));
}
function alleRegios(){
  const set=new Set(inst().regios.map(r=>r.naam));
  S.klanten.forEach(k=>set.add(klantRegio(k)));
  return [...set];
}

/* ---------- Filters ---------- */
const anyFilter=()=>Object.values(UI.f).some(Boolean);
const telKlant=k=>!k._gedeeld||UI.f.bron==='gedeeld';
function klantOk(k){
  const f=UI.f;
  if(f.bron==='eigen'&&k._gedeeld)return false;
  if(f.bron==='gedeeld'&&!k._gedeeld)return false;
  if(f.regio&&klantRegio(k)!==f.regio)return false;
  if(f.gemeente&&(k.gemeente||'')!==f.gemeente)return false;
  if(f.status&&k.status!==f.status)return false;
  if(f.type&&k.type!==f.type)return false;
  if(f.q){const q=f.q.toLowerCase();if(![k.zaak,k.contact,k.gemeente,k.plaats,k.merken,k.verdeler,k.notities].join(' ').toLowerCase().includes(q))return false}
  return true;
}
function relOk(r,km){const k=km[r.klantId];if(!k)return !anyFilter();return klantOk(k)}
function inPeriod(d){
  if(!d)return false;
  if(String(d).slice(0,4)!==UI.jaar)return false;
  if(UI.maand&&+String(d).slice(5,7)!==+UI.maand)return false;
  return true;
}
function periodeLabel(){return UI.maand?MAANDEN_L[+UI.maand-1]+' '+UI.jaar:UI.jaar}

/* ---------- Opslag (Supabase, tabel verkoop_records) ---------- */
const SUPABASE_URL="https://qosjfznmdnswwfnglxqt.supabase.co";
const SUPABASE_ANON_KEY="sb_publishable_pyiiMmH2tpl-lL3e_edcow_4ztJX-Ul";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
const TABEL='verkoop_records';
const KIJK_ROLLEN=['admin','commercieel_directeur'];
let ME=null,PROFIEL=null,PROFIELEN=[],VIEW=null,ALL_INST={};
const isOwnView=()=>VIEW===ME;
const naamVan=id=>{const p=PROFIELEN.find(x=>x.id===id)||(PROFIEL&&PROFIEL.id===id?PROFIEL:null);return p?(p.naam||p.email||'Onbekend'):'Onbekend'};
function saveLocal(){}
function setMode(m){
  MODE=m;
  const el=$('#sync');el.className='sync '+(m==='online'?'online':m==='fout'?'local':'');
  el.querySelector('span').textContent=m==='online'?(isOwnView()?'Bewaard in Achel POS':'Alleen bekijken'):m==='fout'?'Kon gegevens niet laden':'Gegevens laden…';
  document.body.classList.toggle('readonly',!!VIEW&&!isOwnView());
  const i=inst();
  const wie=VIEW==='alle'?'Alle vertegenwoordigers':naamVan(VIEW||ME);
  $('#brandSub').textContent=wie+' · '+i.regios.map(r=>r.naam).join(', ');
  render();
}
function errMsg(e){
  const t=String((e&&(e.message||e.code))||'');
  if(/row-level|permission|42501/i.test(t))return 'Opslaan lukt niet: je kunt alleen je eigen gegevens wijzigen.';
  return 'Opslaan mislukt. Controleer je verbinding en probeer opnieuw.';
}
function clean(o){const r={};Object.keys(o).forEach(k=>{if(o[k]!==undefined&&k!=='id'&&k.charAt(0)!=='_')r[k]=o[k]});return r}
function alleenLezen(){toast('Je bekijkt de gegevens van iemand anders. Wijzigen kan alleen in je eigen overzicht.');throw new Error('alleen lezen')}
const TABEL_G='verkoop_gedeeld';
const PERSOONLIJK=['laatsteBezoek','volgendeActie','volgendeActieDatum','verwachtHL'];
let GEDEELD_OK=true;
function gedeeldNaarKlant(id,data){
  const k=Object.assign({},data||{});const per=k.perRep||{};delete k.perRep;
  PERSOONLIJK.forEach(f=>delete k[f]);
  if(VIEW==='alle'){let lb='';Object.values(per).forEach(v=>{if(v&&v.laatsteBezoek>lb)lb=v.laatsteBezoek});if(lb)k.laatsteBezoek=lb}
  else{const mine=per[VIEW]||{};PERSOONLIJK.forEach(f=>{if(mine[f]!==undefined&&mine[f]!=='')k[f]=mine[f]})}
  return Object.assign(k,{id:id,_gedeeld:true,_owner:null});
}
async function putGedeeld(obj){
  const id=obj.id;const body=clean(obj);
  const {data:cur,error:e1}=await sb.from(TABEL_G).select('data').eq('id',id).maybeSingle();
  if(e1){toast(errMsg(e1));throw e1}
  const base=Object.assign({},cur&&cur.data?cur.data:{});
  const per=Object.assign({},base.perRep||{});const mine=Object.assign({},per[ME]||{});
  PERSOONLIJK.forEach(f=>{if(f in body){mine[f]=body[f]}delete body[f]});
  per[ME]=mine;
  const orig=S.klanten.find(x=>x.id===id);
  if(orig&&cur)Object.keys(body).forEach(f=>{if(JSON.stringify(body[f])===JSON.stringify(orig[f]))delete body[f]});
  const nu=new Date().toISOString();
  const data=Object.assign(base,body,{perRep:per,gewijzigd:nu,gewijzigdDoor:naamVan(ME)});
  const {error}=await sb.from(TABEL_G).upsert({id:id,data:data,updated_at:nu,updated_by:ME},{onConflict:'id'});
  if(error){toast(errMsg(error));throw error}
  const rec=gedeeldNaarKlant(id,data);const i=S.klanten.findIndex(x=>x.id===id);if(i>=0)S.klanten[i]=rec;else S.klanten.push(rec);
  render();return id;
}
async function put(col,obj){
  if(!isOwnView())alleenLezen();
  if(col==='klanten'&&obj._gedeeld)return putGedeeld(obj);
  const id=obj.id||newId();
  const body=clean(obj);body.gewijzigd=new Date().toISOString();
  const {error}=await sb.from(TABEL).upsert({owner:ME,collectie:col,id:id,data:body,updated_at:body.gewijzigd},{onConflict:'owner,collectie,id'});
  if(error){toast(errMsg(error));throw error}
  const rec=Object.assign({},body,{id:id,_owner:ME});
  const arr=S[col];const i=arr.findIndex(x=>x.id===id);if(i>=0)arr[i]=rec;else arr.push(rec);
  render();
  return id;
}
async function del(col,id){
  if(!isOwnView())alleenLezen();
  const kk=col==='klanten'?S.klanten.find(x=>x.id===id):null;
  if(kk&&kk._gedeeld){
    const {error}=await sb.from(TABEL_G).delete().eq('id',id);
    if(error){toast('Alleen admin kan een gedeelde drankenhandel verwijderen.');throw error}
    S.klanten=S.klanten.filter(x=>x.id!==id);render();return;
  }
  const {error}=await sb.from(TABEL).delete().eq('owner',ME).eq('collectie',col).eq('id',id);
  if(error){toast(errMsg(error));throw error}
  S[col]=S[col].filter(x=>x.id!==id);render();
}
async function putInst(o){
  if(!isOwnView())alleenLezen();
  const body=clean(o);
  const {error}=await sb.from(TABEL).upsert({owner:ME,collectie:'instellingen',id:'algemeen',data:body,updated_at:new Date().toISOString()},{onConflict:'owner,collectie,id'});
  if(error){toast(errMsg(error));throw error}
  S.inst=body;ALL_INST[ME]=body;setMode('online');
}
async function loadData(){
  MODE='laden';render();
  try{
    let rows=[],from=0;
    for(;;){
      let q=sb.from(TABEL).select('owner,collectie,id,data').order('owner').order('collectie').order('id').range(from,from+999);
      if(VIEW!=='alle')q=q.eq('owner',VIEW);
      const {data,error}=await q;if(error)throw error;
      rows=rows.concat(data||[]);if(!data||data.length<1000)break;from+=1000;
    }
    COLS.forEach(c=>S[c]=[]);ALL_INST={};
    rows.forEach(r=>{
      if(r.collectie==='instellingen'){ALL_INST[r.owner]=r.data||{};return}
      if(S[r.collectie])S[r.collectie].push(Object.assign({},r.data||{},{id:r.id,_owner:r.owner}));
    });
    if(GEDEELD_OK){
      try{
        let g=[],gf=0;
        for(;;){const {data,error}=await sb.from(TABEL_G).select('id,data').order('id').range(gf,gf+999);if(error)throw error;g=g.concat(data||[]);if(!data||data.length<1000)break;gf+=1000}
        g.forEach(r=>S.klanten.push(gedeeldNaarKlant(r.id,r.data)));
      }catch(e){GEDEELD_OK=false;console.warn('Gedeelde drankenhandels niet beschikbaar:',e)}
    }
    if(VIEW==='alle'){
      const owners=new Set(rows.map(r=>r.owner));let dm=0,dj=0;
      owners.forEach(o=>{const i=Object.assign({},DEFAULTS,ALL_INST[o]||{});dm+=num(i.doelMaand);dj+=num(i.doelJaar)});
      S.inst=Object.assign({},ALL_INST[ME]||{},{doelMaand:dm||DEFAULTS.doelMaand,doelJaar:dj||DEFAULTS.doelJaar});
    }else S.inst=ALL_INST[VIEW]||null;
    setMode('online');
  }catch(e){console.error('VERKOOP LADEN:',e);setMode('fout');toast('De gegevens konden niet geladen worden.')}
}
function renderViewSelect(){
  const s=$('#viewSel');if(!s)return;
  const others=PROFIELEN.filter(p=>p.id!==ME);
  s.innerHTML=`<option value="${esc(ME)}">Mijn overzicht</option>`+others.map(p=>`<option value="${esc(p.id)}">${esc(p.naam||p.email)}</option>`).join('')+'<option value="alle">Alle vertegenwoordigers</option>';
  s.value=VIEW;s.hidden=false;
}
async function initDb(){
  try{
    const {data:{session},error}=await sb.auth.getSession();
    if(error)throw error;
    if(!session||!session.user){window.location.href='../index.html';return}
    ME=session.user.id;VIEW=ME;
    const {data:p}=await sb.from('profiles').select('id,naam,email,rol,actief').eq('id',ME).single();
    PROFIEL=p||null;
    if(PROFIEL&&KIJK_ROLLEN.includes(PROFIEL.rol)){
      const {data:all}=await sb.from('profiles').select('id,naam,email,rol,actief').eq('actief',true).order('naam',{ascending:true});
      PROFIELEN=(all||[]).filter(x=>['vertegenwoordiger','admin','commercieel_directeur'].includes(x.rol));
      renderViewSelect();
    }
    await loadData();
  }catch(e){console.error('VERKOOP INIT:',e);setMode('fout')}
}
$('#viewSel').addEventListener('change',e=>{VIEW=e.target.value;if(VIEW!=='alle'&&UI.groep==='verteg')UI.groep='gemeente';UI.f={regio:'',gemeente:'',status:'',type:'',q:'',bron:''};loadData()});

/* ---------- Kleine bouwstenen ---------- */
const chip=s=>s?`<span class="chip ${STATUS_CLS[s]||''}">${esc(s)}</span>`:'';
const pot=p=>`<span class="pot ${esc(p||'')}" title="Potentieel">${esc(p||'?')}</span>`;
const ex=r=>r&&r.voorbeeld?'<span class="ex">voorbeeld</span>':'';
function opts(list,val,empty){
  let h=empty!=null?`<option value="">${esc(empty)}</option>`:'';
  list.forEach(o=>{const v=Array.isArray(o)?o[0]:o,l=Array.isArray(o)?o[1]:o;h+=`<option value="${esc(v)}"${String(v)===String(val==null?'':val)?' selected':''}>${esc(l)}</option>`});
  return h;
}
function fld(label,name,val,type,attrs,cls){return `<label class="fld ${cls||''}"><span>${label}</span><input id="m_${name}" name="${name}" type="${type||'text'}" value="${esc(val==null?'':val)}" ${attrs||''}></label>`}
function sel(label,name,val,list,empty,cls){return `<label class="fld ${cls||''}"><span>${label}</span><select id="m_${name}" name="${name}">${opts(list,val,empty)}</select></label>`}
function area(label,name,val,cls){return `<label class="fld ${cls||'full'}"><span>${label}</span><textarea id="m_${name}" name="${name}">${esc(val||'')}</textarea></label>`}
function datumKlasse(d){if(!d)return '';const t=today();if(d<t)return 'late';if(d<=addDays(t,2))return 'soon';return ''}
function klantOptions(val,filterFn){
  const list=S.klanten.filter(filterFn||(()=>true)).sort(byName).map(k=>[k.id,(k.zaak||'(naamloos)')+(k.gemeente?' · '+k.gemeente:'')]);
  return opts(list,val,'Kies een klant…');
}

function filterBar(o){
  o=o||{};
  const f=UI.f;
  let h='<div class="fbar">';
  h+=`<input type="search" id="f_q" class="fsearch" data-filter="q" value="${esc(f.q)}" placeholder="Zoek klant, contact, merk…" aria-label="Zoek klant">`;
  if(o.periode){
    const jaren=new Set([String(now.getFullYear()),UI.jaar]);
    S.bestellingen.concat(S.bezoeken).forEach(r=>{if(r.datum)jaren.add(String(r.datum).slice(0,4))});
    h+=`<select id="f_jaar" class="fsel" data-period="jaar" aria-label="Jaar">${opts([...jaren].sort().reverse(),UI.jaar)}</select>`;
    h+=`<select id="f_maand" class="fsel" data-period="maand" aria-label="Maand">${opts(MAANDEN_L.map((m,i)=>[String(i+1),m]),UI.maand,'Heel het jaar')}</select>`;
  }
  h+='</div>';
  const chipB=(k,v,l)=>`<button class="fchip${f[k]===v?' on':''}" data-act="fchip" data-k="${k}" data-v="${esc(v)}" aria-pressed="${f[k]===v}">${esc(l)}${f[k]===v?' <span aria-hidden="true">×</span>':''}</button>`;
  const groepen=[];
  if(S.klanten.some(k=>k._gedeeld))groepen.push([['bron','eigen','Mijn klanten'],['bron','gedeeld','Gedeelde drankenhandels']]);
  groepen.push(alleRegios().map(r=>['regio',r,r]));
  groepen.push(STATUSSEN.map(x=>['status',x,x]));
  groepen.push(TYPES.map(x=>['type',x,x]));
  const aan=[],uit=[];
  if(f.gemeente)aan.push(chipB('gemeente',f.gemeente,f.gemeente));
  groepen.forEach((g,gi)=>{const u=[];g.forEach(([k,v,l])=>{(f[k]===v?aan:u).push(chipB(k,v,l))});if(u.length)uit.push((uit.length?'<span class="fsep" aria-hidden="true"></span>':'')+u.join(''))});
  h+=`<div class="chiprow" role="toolbar" aria-label="Filters">${(anyFilter()||(o.periode&&UI.maand))?'<button class="fchip wis" data-act="clearFilters">Alles wissen</button>':''}${aan.join('')}${aan.length?'<span class="fsep" aria-hidden="true"></span>':''}${uit.join('')}</div>`;
  return h;
}

/* ---------- Grafieken ---------- */
function niceScale(v){
  const steps=[5,10,20,25,50,100,200,250,500,1000,2000,2500,5000];
  for(const s of steps){if(Math.ceil(v/s)<=5)return {max:Math.max(s,Math.ceil(v/s)*s),step:s}}
  const s=Math.ceil(v/5000)*1000;return {max:Math.ceil(v/s)*s,step:s};
}
function barChart(vals,doel,curIdx){
  const W=640,H=230,L=40,R=86,T=14,B=26,iw=W-L-R,ih=H-T-B;
  const sc=niceScale(Math.max(doel*1.15,...vals,1));
  const y=v=>T+ih-(v/sc.max)*ih,bw=iw/12;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="HL per maand met maanddoel">`;
  for(let v=0;v<=sc.max;v+=sc.step)s+=`<line class="grid" x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt0(v)}</text>`;
  vals.forEach((v,i)=>{
    const x=L+i*bw+bw*.18,w=bw*.64;
    if(v>0){s+=`<rect class="barv${v>=doel?' ok':''}${i===curIdx?' cur':''}" x="${x}" y="${y(v)}" width="${w}" height="${T+ih-y(v)}" rx="2"/>`;
      s+=`<text class="val" x="${x+w/2}" y="${y(v)-4}" text-anchor="middle">${fmt(v,v<10?1:0)}</text>`}
    s+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle"${i===curIdx?' class="lbl"':''}>${MAANDEN[i]}</text>`;
  });
  s+=`<line class="goal" x1="${L}" x2="${L+iw}" y1="${y(doel)}" y2="${y(doel)}"/><text class="lbl" x="${L+iw+6}" y="${y(doel)+4}">doel ${fmt0(doel)} HL</text>`;
  return s+'</svg>';
}
function cumChart(vals,doelJaar,doelMaand,lastIdx){
  const W=640,H=230,L=46,R=96,T=14,B=26,iw=W-L-R,ih=H-T-B;
  const cum=[];let t=0;vals.forEach(v=>{t+=v;cum.push(t)});
  const sc=niceScale(Math.max(doelJaar,doelMaand*12,t,1));
  const x=i=>L+(i/12)*iw,y=v=>T+ih-(v/sc.max)*ih;
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulatieve HL tegenover jaardoel">`;
  for(let v=0;v<=sc.max;v+=sc.step)s+=`<line class="grid" x1="${L}" x2="${L+iw}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmt0(v)}</text>`;
  for(let i=0;i<12;i++)s+=`<text x="${x(i+.5)}" y="${H-8}" text-anchor="middle">${MAANDEN[i]}</text>`;
  s+=`<line class="goal" x1="${x(0)}" y1="${y(0)}" x2="${x(12)}" y2="${y(doelJaar)}"/><text class="lbl" x="${x(12)+6}" y="${y(doelJaar)+4}">${fmt0(doelJaar)} HL</text>`;
  if(Math.abs(doelMaand*12-doelJaar)>1)s+=`<line class="goal2" x1="${x(0)}" y1="${y(0)}" x2="${x(12)}" y2="${y(doelMaand*12)}"/><text x="${x(12)+6}" y="${y(doelMaand*12)+4}">${fmt0(doelMaand)}/mnd = ${fmt0(doelMaand*12)}</text>`;
  if(lastIdx>=0){
    let p=`M${x(0)},${y(0)}`;for(let i=0;i<=lastIdx;i++)p+=` L${x(i+1)},${y(cum[i])}`;
    s+=`<path class="area" d="${p} L${x(lastIdx+1)},${y(0)} Z"/><path class="act" d="${p}"/>`;
    s+=`<circle class="dot" cx="${x(lastIdx+1)}" cy="${y(cum[lastIdx])}" r="5"/><text class="val" x="${x(lastIdx+1)}" y="${y(cum[lastIdx])-10}" text-anchor="middle">${fmt(cum[lastIdx],0)}</text>`;
  }
  return s+'</svg>';
}

  const kl=S.klanten.filter(klantOk);
  const klT=kl.filter(telKlant);const nKlant=klT.filter(k=>k.status==='Klant').length,nProsp=klT.filter(k=>k.status&&k.status!=='Klant'&&k.status!=='Verloren').length;

    <div class="bar${hlMaand>=i.doelMaand?' done':''}"><span style="width:${pctM}%"></span></div>
    <p>${hlMaand>=i.doelMaand?'<strong>Maanddoel gehaald.</strong>':'Nog <strong>'+fmt(i.doelMaand-hlMaand)+' HL</strong> ≈ '+fmt0(Math.ceil((i.doelMaand-hlMaand)*100/7.92))+' bakken of '+fmt0(Math.ceil((i.doelMaand-hlMaand)*100/20))+' vaten'}</p></div>`;
  h+=`<div class="tile"><h3>HL in ${esc(UI.jaar)}, richting ${fmt0(i.doelJaar)} HL</h3><div class="big num">${fmt(hlJaar)} <small>/ ${fmt0(i.doelJaar)} HL</small></div>

function klantRij(k,hlTekst){
  const jaar=String(now.getFullYear());
  const lb=laatsteBezoek(k),hl=hlTekst!=null?hlTekst:(hlKlantJaar(k,jaar)?fmt(hlKlantJaar(k,jaar))+' HL':'');
  const info=[k.type,VIEW==='alle'&&!k._gedeeld?naamVan(k._owner):'',k.volgendeActie?(k.volgendeActieDatum?fdate(k.volgendeActieDatum)+': ':'')+k.volgendeActie:(lb?'laatst bezocht '+fdate(lb):'')].filter(Boolean).join(' · ');
  return `<button class="acc-r acc-r2" data-act="editKlant" data-id="${k.id}"><span class="nm"><strong>${esc(k.zaak||'(naamloos)')}</strong>${ex(k)}${k._gedeeld?' <span class="chip st-prospect">Gedeeld</span>':''}<span class="sub${k.volgendeActieDatum?' '+datumKlasse(k.volgendeActieDatum):''}">${esc(info)}</span></span><span class="tel">${chip(k.status)}${hl?'<span class="sub">'+hl+'</span>':''}</span></button>`;
}
function regioAccordeon(){
  const km=klantMap(),perVerteg=VIEW==='alle'&&UI.groep==='verteg';
  if(UI.groep!=='verteg')UI.groep='regio';
  const top={};
  const get=k=>{
    const tk=perVerteg?(k._gedeeld?'gedeeld':(k._owner||'?')):klantRegio(k),gk=k.gemeente||'Onbekend';
    const t=top[tk]||(top[tk]={key:tk,label:perVerteg?(tk==='gedeeld'?'Gedeelde drankenhandels':naamVan(tk)):tk,zaken:0,bezoeken:0,hl:0,sub:{}});
    const g=t.sub[gk]||(t.sub[gk]={key:gk,zaken:0,bezoeken:0,hl:0,ks:{}});
    if(!g.ks[k.id])g.ks[k.id]={k:k,hl:0};
    return [t,g];
  };
  S.klanten.filter(klantOk).forEach(k=>{if(!telKlant(k)||k.status==='Verloren')return;get(k).forEach(x=>x.zaken++)});
  S.bezoeken.forEach(b=>{const k=km[b.klantId];if(k&&klantOk(k)&&inPeriod(b.datum))get(k).forEach(x=>x.bezoeken++)});
  S.bestellingen.forEach(o=>{const k=km[o.klantId];if(k&&klantOk(k)&&inPeriod(o.datum)){const [t,g]=get(k);t.hl+=num(o.hl);g.hl+=num(o.hl);g.ks[k.id].hl+=num(o.hl)}});
  const lijst=Object.values(top).filter(t=>t.zaken||t.hl).sort((a,b)=>(a.key==='Onbekend')-(b.key==='Onbekend')||b.hl-a.hl||b.zaken-a.zaken);
  const tel=x=>`${x.zaken} zaken${x.bezoeken?' · '+x.bezoeken+' bez.':''} · ${fmt(x.hl)} HL`;
  let h=`<section class="panel"><div class="panel-h"><h3>Overzicht per ${perVerteg?'vertegenwoordiger':'regio'}</h3><p>zaken, bezoeken en HL in ${esc(periodeLabel())} · tik om te openen</p><span class="sp"></span>
    ${VIEW==='alle'?`<label class="inline" style="font-size:13px;color:var(--muted)">Per <select id="g_groep" data-groep="1">${opts([['regio','Regio'],['verteg','Vertegenwoordiger']],perVerteg?'verteg':'regio')}</select></label>`:''}</div>`;
  if(!lijst.length)return h+'<div class="empty">Geen gegevens voor deze filters.</div></section>';
  const open=UI.openD||(UI.openD={});
  h+='<div class="acc">';
  lijst.forEach(t=>{
    const isOpen=lijst.length===1||open[t.key];
    h+=`<button class="acc-h" data-act="acc" data-set="openD" data-key="${esc(t.key)}" aria-expanded="${!!isOpen}"><span class="pijl">${isOpen?'▾':'▸'}</span><b>${esc(t.label)}</b><span class="tel">${tel(t)}</span></button>`;
    if(isOpen){
      h+='<div class="acc-b">'+Object.values(t.sub).filter(g=>g.zaken||g.hl).sort((a,b)=>b.hl-a.hl||b.zaken-a.zaken||String(a.key).localeCompare(String(b.key),'nl'))
        .map(g=>{
          const key='g:'+t.key+'|'+g.key,gOpen=open[key];
          let r=`<button class="acc-r acc-g" data-act="acc" data-set="openD" data-key="${esc(key)}" aria-expanded="${!!gOpen}"><span class="pijl">${gOpen?'▾':'▸'}</span><span class="nm"><strong>${esc(g.key)}</strong></span><span class="tel">${tel(g)}</span></button>`;
          if(gOpen)r+=Object.values(g.ks).filter(x=>(telKlant(x.k)&&x.k.status!=='Verloren')||x.hl).sort((a,b)=>b.hl-a.hl||byName(a.k,b.k)).map(x=>klantRij(x.k,x.hl?fmt(x.hl)+' HL':'')).join('');
          return r;
        }).join('')+'</div>';
    }
  });
  return h+'</div></section>';
}

function groepen(){
  const km=klantMap(),by=UI.groep;
  const keyOf=k=>by==='regio'?klantRegio(k):by==='gemeente'?(k.gemeente||'Onbekend'):by==='type'?(k.type||'Onbekend'):by==='verteg'?(k._owner||'?'):k.id;
  const lab=k=>by==='klant'?(k.zaak||'(naamloos)'):by==='verteg'?naamVan(k._owner):keyOf(k);
  const g={};
  const get=k=>{const key=keyOf(k);return g[key]||(g[key]={key:key,label:lab(k),klanten:0,prospecten:0,bezoeken:0,bestellingen:0,hl:0,verwacht:0})};
  S.klanten.filter(klantOk).forEach(k=>{if(!telKlant(k)&&!num(k.verwachtHL))return;const r=get(k);if(telKlant(k)){if(k.status==='Klant')r.klanten++;else if(k.status&&k.status!=='Verloren')r.prospecten++}r.verwacht+=num(k.verwachtHL)});
  S.bezoeken.forEach(b=>{const k=km[b.klantId];if(k&&klantOk(k)&&inPeriod(b.datum))get(k).bezoeken++});
  S.bestellingen.forEach(o=>{const k=km[o.klantId];if(k&&klantOk(k)&&inPeriod(o.datum)){const r=get(k);r.bestellingen++;r.hl+=num(o.hl)}});
  return Object.values(g).sort((a,b)=>b.hl-a.hl||b.verwacht-a.verwacht||String(a.label).localeCompare(String(b.label),'nl'));
}

V.klanten=function(){
  const jaar=String(now.getFullYear());
  let list=S.klanten.filter(klantOk);
  const s=UI.sort;
  list.sort((a,b)=>{
    if(s==='gemeente')return String(a.gemeente||'').localeCompare(String(b.gemeente||''),'nl')||byName(a,b);
    if(s==='actie')return String(a.volgendeActieDatum||'9999').localeCompare(String(b.volgendeActieDatum||'9999'));
    if(s==='verwacht')return num(b.verwachtHL)-num(a.verwachtHL);
    if(s==='hl')return hlKlantJaar(b,jaar)-hlKlantJaar(a,jaar);
    if(s==='bezoek')return String(laatsteBezoek(a)).localeCompare(String(laatsteBezoek(b)));
    return byName(a,b);
  });
  let h=`<div class="head"><div><h2>Klanten</h2><p>${list.length} van ${S.klanten.length} zaken, per regio en gemeente. Tik om te openen.</p></div><div class="actions">
    <label class="inline" style="font-size:13px;color:var(--muted)">Sorteer<select id="s_sort" data-sort="1">${opts([['zaak','Naam'],['gemeente','Gemeente'],['actie','Volgende actie'],['bezoek','Langst niet bezocht'],['verwacht','Verwachte HL'],['hl','HL dit jaar']],s)}</select></label>
    <button class="btn primary" data-act="newKlant">+ Klant of prospect</button></div></div>`;
  h+=filterBar();
  if(!list.length)return h+`<div class="tw"><div class="empty">${S.klanten.length?'Geen klanten voor deze filters.':'Nog geen klanten.'}<br><button class="btn primary" data-act="newKlant">+ Klant of prospect</button></div></div>`;
  const open=UI.openK||(UI.openK={});
  const zoekt=!!(UI.f.q||UI.f.gemeente)&&list.length<=60;
  const tel=ks=>{const nK=ks.filter(k=>k.status==='Klant').length;return ks.length+(nK&&nK<ks.length?' · '+nK+' klant'+(nK>1?'en':''):'')};
  const per={};
  list.forEach(k=>{const r=klantRegio(k),g=k.gemeente||'Onbekend';((per[r]=per[r]||{})[g]=per[r][g]||[]).push(k)});
  const regios=Object.keys(per).sort((a,b)=>(a==='Onbekend')-(b==='Onbekend')||a.localeCompare(b,'nl'));
  h+='<div class="acc">';
  regios.forEach(r=>{
    const gem=per[r],alle=[].concat(...Object.values(gem));
    const rOpen=zoekt||regios.length===1||open['r:'+r];

/* ---------- Seizoensbieren: focusbieren per seizoen ---------- */
const SEIZOENEN=[['lente','Lente',3,'mrt–mei'],['zomer','Zomer',6,'jun–aug'],['herfst','Herfst',9,'sep–nov'],['winter','Winter',12,'dec–feb']];
const SST=['Aanbieden','Aangeboden','Besteld','Geen interesse'];
function seizoenVan(d){const y=+d.slice(0,4),m=+d.slice(5,7);if(m<=2)return {jaar:y-1,s:3};return {jaar:y,s:m<=5?0:m<=8?1:m<=11?2:3}}
function szShift(z,n){let i=z.jaar*4+z.s+n;return {jaar:Math.floor(i/4),s:((i%4)+4)%4}}
const szKey=z=>z.jaar+'-'+SEIZOENEN[z.s][0];
const szNaam=z=>SEIZOENEN[z.s][1]+' '+(z.s===3?z.jaar+'–'+String(z.jaar+1).slice(2):z.jaar);
const szStart=z=>z.jaar+'-'+String(SEIZOENEN[z.s][2]).padStart(2,'0')+'-01';
const szEinde=z=>addDays(szStart(szShift(z,1)),-1);
function szFromKey(k){const p=String(k||'').split('-');const i=SEIZOENEN.findIndex(x=>x[0]===p[1]);return i<0?null:{jaar:+p[0],s:i}}
function szDoc(z){
  const key=szKey(z);const docs=S.seizoensbieren.filter(d=>d.id===key);
  if(docs.length<=1)return docs[0]||{id:key,jaar:z.jaar,seizoen:SEIZOENEN[z.s][0],bieren:[],aanbod:{}};
  const m={id:key,jaar:z.jaar,seizoen:SEIZOENEN[z.s][0],bieren:[],aanbod:{}};
  docs.forEach(d=>{(d.bieren||[]).forEach(b=>{if(!m.bieren.includes(b))m.bieren.push(b)});Object.assign(m.aanbod,d.aanbod||{})});
  return m;
}
function szStats(z,doc){
  const km=klantMap(),van=szStart(z),tot=szEinde(z);
  return (doc.bieren||[]).map(b=>{
    let totaal=0,zaken=0,besteld=0,hl=0;
    Object.entries(doc.aanbod||{}).forEach(([kid,per])=>{const k=km[kid];if(!k||!klantOk(k))return;totaal++;const st=((per||{})[b]||{}).status;if(st==='Aangeboden'||st==='Besteld')zaken++;if(st==='Besteld')besteld++});
    S.bestellingen.forEach(o=>{if(!o.datum||o.datum<van||o.datum>tot||!relOk(o,km))return;(o.regels||[]).forEach(r=>{if(r.product===b)hl+=num(r.aantal)*num(r.liter)/100})});
    return {bier:b,totaal:totaal,zaken:zaken,besteld:besteld,hl:hl};
  });
}
const szChips=doc=>(doc.bieren||[]).length?doc.bieren.map(b=>`<span class="szchip">${esc(b)}</span>`).join(''):'<span class="note">Nog geen focusbieren gekozen</span>';
function szCard(z,label,cls){
  const doc=szDoc(z),st=szStats(z,doc);
  return `<article class="acard szcard ${cls||''}${UI.szKey===szKey(z)?' szsel':''}" data-act="szOpen" data-key="${szKey(z)}">
    <header><h3>${esc(szNaam(z))}</h3>${label}</header>
    <div>${szChips(doc)}</div>
    ${st.length?`<div class="szrows">${st.map(r=>`<div class="szrow"><span>${esc(r.bier)}</span><span class="sub" style="display:inline">${r.totaal?r.zaken+' van '+r.totaal+' zaken aangeboden':'nog geen klanten'} · ${r.besteld} besteld · ${fmt(r.hl)} HL</span></div>`).join('')}</div>`:''}
  </article>`;
}

    <p class="note">Kies er bijvoorbeeld 4. Staat een bier er niet tussen, voeg het dan toe bij <button class="link" data-tab="instellingen">Instellingen</button>.</p>`;

  }
  return h+'</section>';
};
function nogTeDoenVoor(doc){return S.klanten.filter(k=>klantOk(k)&&!k._gedeeld&&k.status==='Klant'&&!(doc.aanbod||{})[k.id]).length}
async function szSave(key,fn){

/* ---------- Agenda: weekplanning ---------- */
const AG_VAN=360,AG_TOT=1320,AG_PX=1; // 6:00 tot 22:00, 1 pixel per minuut
const DAGEN=['Ma','Di','Wo','Do','Vr'],DAGEN_L=['maandag','dinsdag','woensdag','donderdag','vrijdag'];
const hm=m=>String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
const r15=m=>Math.round(m/15)*15;
function maandagVan(d){const x=new Date(d+'T12:00:00');return addDays(d,-((x.getDay()+6)%7))}
function weekNr(d){const x=new Date(d+'T12:00:00');const t=new Date(Date.UTC(x.getFullYear(),x.getMonth(),x.getDate()));const dn=(t.getUTCDay()+6)%7;t.setUTCDate(t.getUTCDate()-dn+3);const f=new Date(Date.UTC(t.getUTCFullYear(),0,4));return 1+Math.round(((t-f)/864e5-3+((f.getUTCDay()+6)%7))/7)}
const agBreed=()=>window.matchMedia('(min-width:900px)').matches;
function agDagen(){return [0,1,2,3,4].map(i=>addDays(UI.agWeek,i))}
const afsOp=d=>S.afspraken.filter(a=>a.datum===d).sort((a,b)=>num(a.start)-num(b.start));
function vrijSlot(d,duur){
  const bezet=afsOp(d).map(a=>[num(a.start),num(a.start)+num(a.duur||60)]);
  const vrij=t=>!bezet.some(([s,e])=>t<e&&t+duur>s);
  for(let t=480;t+duur<=AG_TOT;t+=15)if(vrij(t))return t;
  for(let t=AG_VAN;t<480;t+=15)if(vrij(t))return t;
  return AG_TOT-duur;
}
function banen(lijst){
  const uit=[];let groep=[],eindGroep=-1;
  const sluit=()=>{const n=Math.max(1,...groep.map(x=>x.baan+1));groep.forEach(x=>x.n=n);groep=[]};
  lijst.forEach(a=>{
    const s=num(a.start),e=s+num(a.duur||60);
    if(s>=eindGroep&&groep.length)sluit();
    const bezet=groep.filter(x=>x.e>s).map(x=>x.baan);let b=0;while(bezet.includes(b))b++;
    const x={a:a,s:s,e:e,baan:b};groep.push(x);uit.push(x);eindGroep=Math.max(eindGroep,e);
  });
  if(groep.length)sluit();
  return uit;
}
function agBlok(x){
  const a=x.a,k=find('klanten',a.klantId);
  const w=100/x.n;
  return `<div class="ag-blk${a.status==='gedaan'?' gedaan':''}" data-afs="${a.id}" style="top:${(x.s-AG_VAN)*AG_PX}px;height:${Math.max(15,x.e-x.s)*AG_PX-2}px;left:calc(${x.baan*w}% + 2px);width:calc(${w}% - 4px)">
    <b>${esc(k?k.zaak:a.klantNaam||'Afspraak')}</b><span class="ag-tijd">${hm(x.s)}–${hm(x.e)}${k&&k.gemeente?' · '+esc(k.gemeente):''}</span>${a.notitie?`<span class="ag-not">${esc(a.notitie)}</span>`:''}
    <div class="ag-grip" aria-label="Langer of korter"></div></div>`;
}
V.agenda=function(){
  const t=today();
  if(!UI.agWeek)UI.agWeek=maandagVan(t);
  const dagen=agDagen();
  if(!UI.agDag||!dagen.includes(UI.agDag))UI.agDag=dagen.includes(t)?t:dagen[0];
  if(!UI.agSel)UI.agSel=new Set();
  const breed=agBreed(),toon=breed?dagen:[UI.agDag];
  const d0=new Date(dagen[0]+'T12:00:00'),d4=new Date(dagen[4]+'T12:00:00');
  const titel=`Week ${weekNr(dagen[0])} · ${d0.getDate()}${d0.getMonth()!==d4.getMonth()?' '+MAANDEN_L[d0.getMonth()]:''}–${d4.getDate()} ${MAANDEN_L[d4.getMonth()]}`;
  let h=`<div class="head"><div><h2>Agenda</h2><p>${esc(titel)}. Houd een afspraak vast om te verslepen, sleep de onderrand voor langer of korter.</p></div>
    <div class="actions"><button class="btn" data-act="agWeek" data-n="-7" aria-label="Vorige week">‹</button><button class="btn" data-act="agWeek" data-n="0">Deze week</button><button class="btn" data-act="agWeek" data-n="7" aria-label="Volgende week">›</button></div></div>`;

let AGD=null;
function agTekst(blk,s,e){const t=blk.querySelector('.ag-tijd');if(t)t.textContent=hm(s)+'–'+hm(e)+(t.textContent.includes(' · ')?' · '+t.textContent.split(' · ').slice(1).join(' · '):'')}
document.addEventListener('pointerdown',e=>{
  const blk=e.target.closest&&e.target.closest('.ag-blk');if(!blk)return;
  const a=find('afspraken',blk.dataset.afs);if(!a)return;
  const resize=!!e.target.closest('.ag-grip');
  AGD={a:a,blk:blk,resize:resize,x0:e.clientX,y0:e.clientY,start:num(a.start),duur:num(a.duur||60),datum:a.datum,actief:false,bewogen:false,muis:e.pointerType==='mouse',t0:Date.now()};
  AGD.nStart=AGD.start;AGD.nDuur=AGD.duur;AGD.nDatum=AGD.datum;
  if(!isOwnView())return;
  if(AGD.muis){AGD.actief=true;if(resize)e.preventDefault()}
  else AGD.timer=setTimeout(()=>{if(AGD&&!AGD.bewogen){AGD.actief=true;blk.classList.add('drag');try{navigator.vibrate&&navigator.vibrate(15)}catch(x){}}},350);
});
document.addEventListener('pointermove',e=>{
  if(!AGD)return;
  const dx=e.clientX-AGD.x0,dy=e.clientY-AGD.y0;
  if(!AGD.actief){if(Math.abs(dx)>8||Math.abs(dy)>8){clearTimeout(AGD.timer);AGD.gescrold=true}return}
  if(Math.abs(dx)<3&&Math.abs(dy)<3&&!AGD.bewogen)return;
  AGD.bewogen=true;AGD.blk.classList.add('drag');
  const min=dy/AG_PX;
  if(AGD.resize){
    AGD.nDuur=Math.max(15,Math.min(r15(AGD.duur+min),AG_TOT-AGD.start));
    AGD.blk.style.height=(AGD.nDuur*AG_PX-2)+'px';
    agTekst(AGD.blk,AGD.start,AGD.start+AGD.nDuur);
  }else{
    AGD.nStart=Math.max(AG_VAN,Math.min(r15(AGD.start+min),AG_TOT-AGD.duur));
    AGD.blk.style.top=((AGD.nStart-AG_VAN)*AG_PX)+'px';
    agTekst(AGD.blk,AGD.nStart,AGD.nStart+AGD.duur);
    if(agBreed()){
      AGD.blk.style.pointerEvents='none';
      const el=document.elementFromPoint(e.clientX,e.clientY);
      AGD.blk.style.pointerEvents='';
      const col=el&&el.closest&&el.closest('.ag-col');
      if(col&&col.dataset.d!==AGD.nDatum){AGD.nDatum=col.dataset.d;col.appendChild(AGD.blk);AGD.blk.style.left='2px';AGD.blk.style.width='calc(100% - 4px)'}
    }
  }
});
document.addEventListener('touchmove',e=>{if(AGD&&AGD.actief)e.preventDefault()},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target.closest&&e.target.closest('.ag-blk'))e.preventDefault()});
async function agLos(e,geannuleerd){
  if(!AGD)return;const d=AGD;AGD=null;clearTimeout(d.timer);
  d.blk.classList.remove('drag');
  if(geannuleerd){render();return}
  if(d.bewogen&&d.actief){
    if(d.nStart!==d.start||d.nDuur!==d.duur||d.nDatum!==d.datum){
      try{await put('afspraken',Object.assign({},d.a,{start:d.nStart,duur:d.nDuur,datum:d.nDatum}))}catch(err){render()}
    }else render();
    return;
  }
  if(!d.gescrold&&!d.bewogen&&(d.muis||Date.now()-d.t0<350)){
    // openen bij de 'click' die volgt, zodat die klik het venster niet meteen weer sluit
    AG_TAP=d.a.id;setTimeout(()=>{if(AG_TAP===d.a.id){AG_TAP=null;afspraakForm(d.a)}},450);
  }else if(d.actief)render();
}
let AG_TAP=null;
document.addEventListener('click',e=>{
  const b=e.target.closest&&e.target.closest('.ag-blk');
  if(b&&AG_TAP===b.dataset.afs){AG_TAP=null;const a=find('afspraken',b.dataset.afs);if(a)afspraakForm(a)}
});
document.addEventListener('pointerup',e=>agLos(e,false));
document.addEventListener('pointercancel',e=>{if(AGD&&AGD.actief)agLos(e,true);else{if(AGD)clearTimeout(AGD.timer);AGD=null}});

V.opvolging=function(){
  const t=today(),w=addDays(t,7);
  const list=S.klanten.filter(k=>klantOk(k)&&k.status!=='Verloren'&&(k.volgendeActie||k.volgendeActieDatum));
  const groups=[['Te laat',k=>k.volgendeActieDatum&&k.volgendeActieDatum<t,'late'],['Vandaag',k=>k.volgendeActieDatum===t,'today'],['Deze week',k=>k.volgendeActieDatum>t&&k.volgendeActieDatum<=w,''],['Later',k=>k.volgendeActieDatum>w,''],['Zonder datum',k=>!k.volgendeActieDatum,'']];
  let h=`<div class="head"><div><h2>Opvolging</h2><p>Alle volgende acties uit je klantfiches. "Afgewerkt" logt meteen een contactmoment.</p></div></div>`;
  h+=filterBar();
  const nobezoek=S.klanten.filter(k=>klantOk(k)&&!k._gedeeld&&k.status==='Klant'&&(!laatsteBezoek(k)||laatsteBezoek(k)<addDays(t,-90)));
  if(!list.length)h+='<div class="tw"><div class="empty">Geen openstaande acties. Vul bij een klant een "volgende actie" in.</div></div>';
  groups.forEach(([naam,fn,cls])=>{
    const items=list.filter(fn).sort((a,b)=>String(a.volgendeActieDatum||'').localeCompare(String(b.volgendeActieDatum||''))||byName(a,b));
    if(!items.length)return;
    h+=`<section class="fgroup"><h3>${naam} <span class="sub" style="display:inline">(${items.length})</span></h3><div class="flist">`;
    items.forEach(k=>{h+=`<div class="fitem ${cls}"><div class="what">${esc(k.volgendeActie||'(geen omschrijving)')}</div><div class="acts"><button class="btn small primary" data-act="followDone" data-id="${k.id}">Afgewerkt</button><button class="btn small" data-act="followLater" data-id="${k.id}">+1 week</button></div>
      <div class="who">${k.volgendeActieDatum?`<span class="${datumKlasse(k.volgendeActieDatum)}">${fdate(k.volgendeActieDatum)}</span> · `:''}<button class="link" data-act="editKlant" data-id="${k.id}">${esc(k.zaak)}</button> · ${esc(k.gemeente||'')} ${chip(k.status)}</div></div>`});
    h+='</div></section>';
  });
  if(nobezoek.length)h+=`<section class="panel"><div class="panel-h"><h3>Klanten langer dan 3 maanden niet bezocht</h3><p>${nobezoek.length} zaken</p></div><div class="tw"><table><tbody>${nobezoek.sort((a,b)=>String(laatsteBezoek(a)).localeCompare(String(laatsteBezoek(b)))).map(k=>`<tr class="click" data-act="editKlant" data-id="${k.id}"><td><strong>${esc(k.zaak)}</strong></td><td>${esc(k.gemeente||'')}</td><td>${laatsteBezoek(k)?'laatst '+fdate(laatsteBezoek(k)):'nog nooit bezocht'}</td></tr>`).join('')}</tbody></table></div></section>`;
  return h;
};

/* ---------- Klanten inladen uit Salesforce ---------- */
const SF_FUSIES={'overpelt':'Pelt','neerpelt':'Pelt','meeuwen-gruitrode':'Oudsbergen','opglabbeek':'Oudsbergen','tessenderlo':'Tessenderlo-Ham','ham':'Tessenderlo-Ham','kortessem':'Hasselt'};
const isAdmin=()=>!!(PROFIEL&&PROFIEL.rol==='admin');
const sfTxt=v=>v==null?'':String(v).replace(/\s+/g,' ').trim();
const sfCompact=v=>sfTxt(v).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,'');
function sfTitel(v){
  const t=sfTxt(v);if(!t)return '';
  const bekend=alleGemeenten('').find(g=>g.toLowerCase()===t.toLowerCase());if(bekend)return bekend;
  return t.toLowerCase().replace(/(^|[\s\-'(])([a-zà-ÿ])/g,(m,a,b)=>a+b.toUpperCase());
}
function sfDatum(v){const m=sfTxt(v).match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);return m?m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0'):''}
function sfMatch(naam,profielen){
  if(/inactive|shared|administrator/i.test(naam))return '';
  const c=sfCompact(naam);if(!c)return '';
  let best='',score=0;
  profielen.forEach(p=>{
    const toks=String(p.naam||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').split(/[^a-z]+/).filter(x=>x.length>=2);
    if(toks.length&&toks.every(t=>c.includes(t))&&toks.length>score){best=p.id;score=toks.length}
  });
  return best;
}
function sfKlant(r){
  const naam=sfTxt(r['Naam']);if(!naam||/^0+$/.test(naam))return null;
  const delen=sfTxt(r['Stadsnaam']).split(/\s+-\s+/);
  let gem=sfTitel(delen[0]);gem=SF_FUSIES[gem.toLowerCase()]||gem;
  const deel=delen[1]?sfTitel(delen[1]):'';
  const rel1=sfTxt(r['Type relatie 1']),rel2=sfTxt(r['Type relatie 2']).toLowerCase();
  const type=/drankenhandel|slijterij/i.test(rel1)?'Drankenhandel':/^retail/i.test(rel1)?'Retail / supermarkt':/event/i.test(rel1)?'Evenement / vereniging':/horeca/i.test(rel1)?'Horeca':'Andere';
  const status=/^klant|vatenklant/.test(rel2)?'Klant':/potenti[eë]le klant/.test(rel2)?'In gesprek':/geen potentieel/.test(rel2)?'Gepauzeerd':'Prospect';
  const lev=sfTxt(r['Leverancier']),pils=sfTxt(r['Pils brouwer']);
  const nr=sfTxt(r['Klantnr.']);
  const info=[['Soort zaak',r['Type Horeca']],['Relatie in Salesforce',r['Type relatie 2']],['Bezoekfrequentie',r['Bezoek frequentie']],['Seizoensklant',r['Seizoensklant']],['Kranen',r['#Kranen']],['Wisselkranen',r['#Wisselkranen']],['Eigenaar gebouw',r['Eigenaar gebouw']],['Retailer',r['Retailer']],['Taal',r['Taal']],['Bezoeken dit jaar',r['Bezoeken huidig jaar']],['Salesforce klantnr.',nr]]
    .filter(([k,v])=>{const t=sfTxt(v);return t&&!/^onbekend/i.test(t)}).map(([k,v])=>k+': '+sfTxt(v));
  const id='sf-'+((nr||sfCompact(naam+delen[0])).replace(/[^A-Za-z0-9_.~:@+-]/g,'').slice(0,70)||newId());
  const k={zaak:naam,type:type,status:status,potentieel:/geen potentieel/.test(rel2)?'C':'?',contact:'',telefoon:sfTxt(r['Telefoon']),email:sfTxt(r['Email address']),
    gemeente:gem,plaats:[sfTxt(r['Straat']),[sfTxt(r['Postcode']),deel].filter(Boolean).join(' ')].filter(Boolean).join(', '),
    merken:pils&&!/onbekend/i.test(pils)?'Pils: '+pils:'',contract:lev?'Via verdeler':'Onbekend',verdeler:lev,
    laatsteBezoek:sfDatum(r['Vorig bez']),notities:info.join('\n'),bron:'Salesforce',salesforceNr:nr,provincie:sfTxt(r['Regio']),gewijzigd:new Date().toISOString()};
  Object.keys(k).forEach(x=>{if(k[x]==='')delete k[x]});
  return {id:id,data:k};
}
function laadScript(src){return new Promise((ok,nok)=>{if(window.XLSX)return ok();const sc=document.createElement('script');sc.src=src;sc.onload=ok;sc.onerror=()=>nok(new Error('script'));document.head.appendChild(sc)})}
async function impLees(file){
  if(!file)return;
  UI.imp={msg:'Bestand lezen…',groups:[]};render();
  try{
    await laadScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array'});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:null,raw:false});
    if(!rows.length||!('Naam' in rows[0])){UI.imp={msg:'Dit bestand heeft geen kolom "Naam". Kies de klantenexport uit Salesforce.',groups:[]};render();return}
    const profielen=isAdmin()?PROFIELEN.concat(PROFIEL&&!PROFIELEN.some(p=>p.id===PROFIEL.id)?[PROFIEL]:[]):(PROFIEL?[PROFIEL]:[]);
    const per={};
    rows.forEach(r=>{const v=sfTxt(r['Vertegenwoordiger'])||'(geen vertegenwoordiger)';(per[v]=per[v]||[]).push(r)});
    let groups=Object.entries(per).map(([sf,rs])=>({sf:sf,rows:rs,target:isAdmin()&&/shared/i.test(sf)?'gedeeld':sfMatch(sf,profielen)}));
    if(!isAdmin())groups=groups.filter(g=>g.target===ME);
    groups.sort((a,b)=>(b.target?1:0)-(a.target?1:0)||b.rows.length-a.rows.length);
    UI.imp={msg:groups.length?'':'Er staan geen klanten op jouw naam in dit bestand.',groups:groups,file:file.name};
  }catch(e){console.error(e);UI.imp={msg:'Het bestand kon niet gelezen worden. Controleer je verbinding en probeer opnieuw.',groups:[]}}
  render();
}
async function impGo(){
  const im=UI.imp;if(!im||im.busy)return;
  const todo=im.groups.filter(g=>g.target);if(!todo.length){toast('Kies bij minstens één regel voor wie de klanten zijn.');return}
  im.busy=true;let nieuw=0,totaal=0;
  try{
    for(const g of todo){
      if(g.target==='gedeeld'){
        const gl=[];g.rows.forEach(r=>{const k=sfKlant(r);if(!k)return;const d=k.data;
          if(d.laatsteBezoek){d.notities=(d.notities?d.notities+'\n':'')+'Laatste bezoek in Salesforce: '+fdate(d.laatsteBezoek);delete d.laatsteBezoek}
          d.gewijzigdDoor='Salesforce';gl.push({id:k.id.replace(/^sf-/,'gd-'),data:d})});
        totaal+=gl.length;
        for(let i=0;i<gl.length;i+=400){
          im.msg='Bezig met gedeelde drankenhandels… '+Math.min(i+400,gl.length)+' / '+gl.length;render();
          const {data,error}=await sb.rpc('verkoop_import_gedeeld',{p_rows:gl.slice(i,i+400)});
          if(error)throw error;nieuw+=num(data);
        }
        GEDEELD_OK=true;continue;
      }
      const list=[];const regios={};
      g.rows.forEach(r=>{const k=sfKlant(r);if(!k)return;list.push({collectie:'klanten',id:k.id,data:k.data});
        const prov=k.data.provincie||'Andere';if(k.data.gemeente){(regios[prov]=regios[prov]||new Set()).add(k.data.gemeente)}});
      if(g.target!==ME&&Object.keys(regios).length)list.push({collectie:'instellingen',id:'algemeen',data:{regios:Object.entries(regios).map(([n,set])=>({naam:n,gemeenten:[...set].sort((a,b)=>a.localeCompare(b,'nl'))}))}});
      totaal+=list.length;
      for(let i=0;i<list.length;i+=400){
        im.msg='Bezig met '+(naamVan(g.target))+'… '+Math.min(i+400,list.length)+' / '+list.length;render();
        const {data,error}=await sb.rpc('verkoop_import',{p_owner:g.target,p_rows:list.slice(i,i+400)});
        if(error)throw error;nieuw+=num(data);
      }
    }
    im.busy=false;im.done=true;
    im.msg='Klaar: '+nieuw+' nieuwe klanten ingeladen'+(totaal>nieuw?' ('+(totaal-nieuw)+' stonden er al in en zijn niet aangepast)':'')+'.';
    toast('Klanten ingeladen');
    await loadData();
  }catch(e){console.error('IMPORT:',e);im.busy=false;im.msg='Inladen gestopt: '+(/verkoop_import_gedeeld|function|schema cache/i.test(String(e.message))?'de opslag voor gedeelde drankenhandels is nog niet klaargezet in Supabase.':/admin/.test(String(e.message))?'alleen een admin kan voor collega\'s inladen.':'controleer je verbinding en probeer opnieuw. Wat al ingeladen was, blijft staan.');render()}
}
