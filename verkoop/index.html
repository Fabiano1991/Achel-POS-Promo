  const k=S.klanten.find(x=>x.id===(b.klantId||o.klant));
  const body=`<div class="form-grid">
    ${o.afspraak&&k?`<div class="fld"><span>Klant</span><strong style="font-size:15px;color:var(--ink);padding:7px 0">${esc(k.zaak)}${k.gemeente?' · '+esc(k.gemeente):''}</strong><input type="hidden" name="klantId" value="${esc(k.id)}"></div>`:`<label class="fld"><span>Klant *</span><select id="m_klantId" name="klantId" required>${klantOptions(b.klantId||o.klant||'')}</select></label>`}
    ${fld('Datum','datum',b.datum||(o&&o.datum)||today(),'date')}
    ${sel('Soort contact','soort',b.soort||'Bezoek',SOORT_BEZOEK)}
    ${area('Verslag','verslag',b.verslag||o.verslag||'')}
    <div class="sect">Wat is de volgende stap?</div>
    ${fld('Volgende actie','volgendeActie',b.id?b.volgendeActie:(o.done?'':(k&&k.volgendeActie)||''),'text','placeholder="Laat leeg als er niets gepland is"')}
    ${fld('Datum volgende actie','volgendeActieDatum',b.id?b.volgendeActieDatum:(o.done?'':(k&&k.volgendeActieDatum)||''),'date')}
    ${sel('Status van de klant na dit contact','statusNa','',STATUSSEN,'Ongewijzigd')}
    ${o.done?'<input type="hidden" name="done" value="1">':''}
  </div><p class="note">De volgende actie en status worden ook in de klantfiche bijgewerkt.</p>`;
  openModal(b.id?'Bezoek bewerken':(o.done?'Actie afgewerkt: contact loggen':'Bezoek loggen'),body,async f=>{
    if(!f.klantId){toast('Kies een klant.');throw new Error('leeg')}
    const kk=S.klanten.find(x=>x.id===f.klantId);
    const rec=Object.assign({},b,{klantId:f.klantId,klantNaam:kk?kk.zaak:'',datum:f.datum,soort:f.soort,verslag:f.verslag,volgendeActie:f.volgendeActie,volgendeActieDatum:f.volgendeActieDatum});
    await put('bezoeken',rec);
    if(kk){
      const upd=Object.assign({},kk);
      if(!upd.laatsteBezoek||f.datum>upd.laatsteBezoek)upd.laatsteBezoek=f.datum;
      if(f.volgendeActie||f.volgendeActieDatum||f.done){upd.volgendeActie=f.volgendeActie;upd.volgendeActieDatum=f.volgendeActieDatum}
      if(f.statusNa)upd.status=f.statusNa;
      await put('klanten',upd);
    }
    if(o.afspraak){const af=find('afspraken',o.afspraak);if(af)await put('afspraken',Object.assign({},af,{status:'gedaan'}))}
    toast('Contact opgeslagen');
  },{extra:delBtn('bezoeken',b.id)});
}

function lineRow(r,n){
  const i=inst();
  return `<div class="line" data-line="${n}"><select id="ln_p_${n}" class="lp" aria-label="Bier">${opts(i.producten.concat(r.product&&!i.producten.includes(r.product)?[r.product]:[]),r.product||i.producten[0])}</select><select id="ln_e_${n}" class="le" aria-label="Verpakking">${opts(i.eenheden.map(x=>[x.id,x.naam]),r.eenheid||'bak')}</select><input id="ln_a_${n}" class="la" type="number" min="0" step="1" value="${esc(r.aantal||'')}" placeholder="aantal" aria-label="Aantal" inputmode="numeric"><button type="button" class="icon" data-act="delLine" aria-label="Regel verwijderen">×</button></div>`;
}
let lineCount=0;
function collectLines(){
  return [...document.querySelectorAll('#lines .line')].map(el=>{const e=eenheid(el.querySelector('.le').value)||{};return {product:el.querySelector('.lp').value,eenheid:el.querySelector('.le').value,eenheidNaam:e.naam||'',liter:num(e.liter),aantal:num(el.querySelector('.la').value)}}).filter(r=>r.aantal>0);
}
function updateHL(){const el=$('#hlPrev');if(el){const hl=collectLines().reduce((a,r)=>a+r.aantal*r.liter/100,0);el.textContent=fmt(hl,2)+' HL'}}
function bestellingForm(b,o){
  b=b||{};o=o||{};
  const k=S.klanten.find(x=>x.id===(b.klantId||o.klant));
  const regels=(b.regels&&b.regels.length?b.regels:[{eenheid:'bak'},{eenheid:'vat'}]);
  lineCount=regels.length;
  const body=`<div class="form-grid">
    <label class="fld"><span>Klant *</span><select id="m_klantId" name="klantId" required>${klantOptions(b.klantId||o.klant||'')}</select></label>
    ${fld('Datum','datum',b.datum||today(),'date')}
    ${sel('Geleverd via','via',b.via||(k&&k.contract==='Via verdeler'?'Verdeler':'Rechtstreeks'),['Rechtstreeks','Verdeler','Drankenhandel'])}
    ${fld('Naam verdeler / handel','verdeler',b.verdeler||(k&&k.verdeler)||'')}
  </div>
  <div><div class="lines" id="lines">${regels.map((r,n)=>lineRow(r,n)).join('')}</div>
  <p class="note" style="margin-top:6px"><button type="button" class="link" data-act="addLine">+ Regel toevoegen</button></p></div>
  <div class="inline"><span class="note">Totaal:</span><span class="hlprev" id="hlPrev">0 HL</span></div>
  ${area('Notitie','notitie',b.notitie)}`;
  openModal(b.id?'Bestelling bewerken':'Nieuwe bestelling',body,async f=>{
    if(!f.klantId){toast('Kies een klant.');throw new Error('leeg')}
    const regels=collectLines();
    if(!regels.length){toast('Vul minstens één aantal in.');throw new Error('leeg')}
    const kk=S.klanten.find(x=>x.id===f.klantId);
    const hl=Math.round(regels.reduce((a,r)=>a+r.aantal*r.liter/100,0)*10000)/10000;
    await put('bestellingen',Object.assign({},b,{klantId:f.klantId,klantNaam:kk?kk.zaak:'',datum:f.datum,via:f.via,verdeler:f.verdeler,regels:regels,hl:hl,notitie:f.notitie}));
    if(kk&&kk.status!=='Klant'&&(kk.status==='Prospect'||kk.status==='In gesprek'||kk.status==='Proef / offerte'))toast('Bestelling opgeslagen. Tip: zet '+kk.zaak+' op status Klant.');
    else toast('Bestelling opgeslagen');
  },{extra:delBtn('bestellingen',b.id)});
  updateHL();
}

function actieForm(a){
  a=a||{};
  const body=`<div class="form-grid">
    ${fld('Naam van de actie *','titel',a.titel,'text','placeholder="bv. Tripel 5+1 voorjaar"')}
    <label class="fld"><span>Drankenhandel *</span><select id="m_klantId" name="klantId">${klantOptions(a.klantId||'',k=>k.type==='Drankenhandel'||k.id===a.klantId)}</select><small>Enkel zaken met soort "Drankenhandel". <button type="button" class="link" data-act="newKlant" data-type="Drankenhandel">Nieuwe drankenhandel</button></small></label>
    ${fld('Van','van',a.van,'date')}
    ${fld('Tot','tot',a.tot,'date')}
    ${fld('Mechanisme','mechanisme',a.mechanisme,'text','placeholder="bv. korting, display, folder, proeverij"')}
    ${fld('Bieren','producten',a.producten,'text','placeholder="bv. Tripel, Dubbel"')}
    ${fld('Doel (HL)','doelHL',a.doelHL,'number','min="0" step="0.1"')}
    ${fld('Behaald (HL)','behaaldHL',a.behaaldHL,'number','min="0" step="0.1"')}
    ${sel('Status','status',a.status||'Actief',[['Actief','Actief (volgens data)'],['Geannuleerd','Geannuleerd']])}
    ${area('Notities','notities',a.notities)}
  </div>`;
  openModal(a.id?'Actie bewerken':'Nieuwe drankenhandelactie',body,async f=>{
    if(!f.titel||!f.klantId){toast('Vul een naam in en kies een drankenhandel.');throw new Error('leeg')}
    const kk=S.klanten.find(x=>x.id===f.klantId);
    await put('acties',Object.assign({},a,f,{klantNaam:kk?kk.zaak:''}));toast('Actie opgeslagen');
  },{extra:delBtn('acties',a.id)});
}

/* ---------- Acties ---------- */
const find=(col,id)=>S[col].find(x=>x.id===id);
const ACT={
  closeModal:closeModal,
  newKlant:d=>klantForm({status:d.status||'Prospect',type:d.type||'Horeca',gemeente:UI.f.gemeente||'',regio:''}),
  editKlant:d=>klantForm(find('klanten',d.id)),
  bewerkKlant:d=>klantBewerk(find('klanten',d.id)),
  agWeek:d=>{const n=num(d.n);UI.agWeek=n?addDays(UI.agWeek,n):maandagVan(today());UI.agDag=null;UI.agScroll=null;render()},
  agDag:d=>{UI.agDag=d.d;render()},
  agPlan:()=>agPlan(),
  agWis:()=>{UI.agSel=new Set();render()},
  agBezoek:d=>{const a=find('afspraken',d.id);if(!a)return;closeModal();bezoekForm(null,{klant:a.klantId,datum:a.datum,afspraak:a.id})},
  newBezoek:d=>bezoekForm(null,{klant:d.klant}),
  editBezoek:d=>bezoekForm(find('bezoeken',d.id)),
  newBestelling:d=>bestellingForm(null,{klant:d.klant}),
  editBestelling:d=>bestellingForm(find('bestellingen',d.id)),
  newActie:()=>actieForm(),
  editActie:d=>actieForm(find('acties',d.id)),
  addLine:()=>{const w=$('#lines');w.insertAdjacentHTML('beforeend',lineRow({eenheid:'bak'},lineCount++));const l=w.lastElementChild.querySelector('.la');if(l)l.focus()},
  delLine:(d,el)=>{const l=el.closest('.line');if(l)l.remove();updateHL()},
  clearFilters:()=>{UI.f={regio:'',gemeente:'',status:'',type:'',q:'',bron:''};UI.maand='';render()},
  drill:d=>{
    if(UI.groep==='klant'){klantForm(find('klanten',d.key));return}
    if(UI.groep==='gemeente'){UI.f.gemeente=d.key==='Onbekend'?'':d.key;UI.groep='klant'}
    else if(UI.groep==='regio'){UI.f.regio=d.key;UI.groep='gemeente'}
    else if(UI.groep==='type'){UI.f.type=d.key==='Onbekend'?'':d.key;UI.groep='klant'}
    else if(UI.groep==='verteg'){VIEW=d.key;const vs=$('#viewSel');if(vs)vs.value=d.key;UI.groep='gemeente';loadData();return}
    render();
  },
  move:async d=>{const k=find('klanten',d.id);if(!k)return;const i=STATUSSEN.indexOf(k.status||'Prospect')+num(d.dir);if(i<0||i>=STATUSSEN.length)return;await put('klanten',Object.assign({},k,{status:STATUSSEN[i]}))},
  followDone:d=>{const k=find('klanten',d.id);if(k)bezoekForm(null,{klant:k.id,done:true,verslag:k.volgendeActie?'Afgewerkt: '+k.volgendeActie:''})},
  followLater:async d=>{const k=find('klanten',d.id);if(!k)return;const t=today();const base=k.volgendeActieDatum&&k.volgendeActieDatum>t?k.volgendeActieDatum:t;await put('klanten',Object.assign({},k,{volgendeActieDatum:addDays(base,7)}));toast('Verschoven naar '+fdate(addDays(base,7)))},
  deleteRec:async(d,el)=>{
    if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='Klik nogmaals om te verwijderen';return}
    await del(d.col,d.id);closeModal();toast('Verwijderd');
  },
  szOpen:d=>{UI.szKey=d.key;render();const el=document.getElementById('szDetail');if(el)el.scrollIntoView({behavior:'smooth',block:'start'})},
  szBierAdd:async d=>{const b=$('#szb_new').value;if(!b){toast('Kies eerst een bier.');return}await szSave(d.key,doc=>{if(!doc.bieren.includes(b))doc.bieren.push(b)})},
  szBierDel:async d=>{await szSave(d.key,doc=>{doc.bieren=doc.bieren.filter(x=>x!==d.bier)})},
  szKlantAdd:async d=>{const kid=$('#szk_new').value;if(!kid){toast('Kies eerst een klant.');return}await szSave(d.key,doc=>{doc.aanbod[kid]=doc.aanbod[kid]||{}})},
  szKlantDel:async d=>{await szSave(d.key,doc=>{delete doc.aanbod[d.klant]})},
  szAlleKlanten:async d=>{await szSave(d.key,doc=>{S.klanten.forEach(k=>{if(klantOk(k)&&!k._gedeeld&&k.status==='Klant'&&!doc.aanbod[k.id])doc.aanbod[k.id]={}})});toast('Klanten toegevoegd')},
  addEenheid:()=>{UI.extraEenheden++;render()},
  impGo:()=>impGo(),
  bron:d=>{UI.f.bron=d.v||'';render()},
  fchip:d=>{const k=d.k,v=d.v||'';UI.f[k]=UI.f[k]===v?'':v;if(k==='regio'&&UI.f.gemeente&&regioVan(UI.f.gemeente)&&regioVan(UI.f.gemeente)!==UI.f.regio)UI.f.gemeente='';render()},
  acc:(d,el)=>{
    const st=UI[d.set]||(UI[d.set]={});const wasOpen=!!st[d.key];st[d.key]=!wasOpen;
    const top=el.getBoundingClientRect().top;
    render();
    const nieuw=[...document.querySelectorAll('#view [data-act="acc"]')].find(x=>x.dataset.set===d.set&&x.dataset.key===d.key);
    if(!nieuw)return;
    const r=nieuw.getBoundingClientRect().top;
    if(wasOpen){if(r<0||top<=1)window.scrollBy(0,r-Math.max(0,Math.min(top,80)))}
    else if(Math.abs(r-top)>1)window.scrollBy(0,r-top);
  },
  impReset:()=>{UI.imp=null;render()},
  copyExport:async()=>{UI.showExport=true;const txt=JSON.stringify(exportData(),null,1);try{await navigator.clipboard.writeText(txt);toast('Gekopieerd naar je klembord')}catch(e){toast('Kopiëren lukte niet. Selecteer de tekst hieronder en kopieer handmatig.')}render()},
  delVoorbeelden:async(d,el)=>{
    if(el.dataset.armed!=='1'){el.dataset.armed='1';el.textContent='Klik nogmaals: voorbeelden verwijderen';return}
    for(const c of COLS){for(const r of S[c].filter(x=>x.voorbeeld)){try{await del(c,r.id)}catch(e){return}}}
    toast('Voorbeeldgegevens verwijderd');
  }
};

/* ---------- Render ---------- */
function renderTabs(){
  const t=today();
  const late=S.klanten.filter(k=>k.status!=='Verloren'&&k.volgendeActieDatum&&k.volgendeActieDatum<t).length;
  $('#tabs').innerHTML=TABS.map(([id,l])=>`<button class="tab" data-tab="${id}"${UI.tab===id?' aria-current="page"':''}>${l}${id==='opvolging'&&late?`<b>${late}</b>`:''}</button>`).join('');
}
function render(){
  const a=document.activeElement;
  const typvak=a&&a.tagName==='INPUT'&&/^(search|text|number|tel|email)$/.test(a.type);
  const aid=typvak&&a.id&&$('#view').contains(a)?a.id:null;
  const rij=document.querySelector('#view .chiprow');const rijX=rij?rij.scrollLeft:0;
  let sel=null;try{if(aid&&a.selectionStart!=null)sel=[a.selectionStart,a.selectionEnd]}catch(e){}
  renderTabs();
  $('#view').innerHTML=(VIEW&&!isOwnView()?'<div class="banner">Je bekijkt '+(VIEW==='alle'?'de gegevens van <strong>alle vertegenwoordigers</strong>':'het overzicht van <strong>'+esc(naamVan(VIEW))+'</strong>')+'. Alleen bekijken: wijzigen kan alleen in je eigen overzicht.</div>':'')+(MODE==='fout'?'<div class="banner">De gegevens konden niet geladen worden. Controleer je verbinding en open de module opnieuw.</div>':'')+(V[UI.tab]||V.dashboard)();
  if(aid){const el=document.getElementById(aid);if(el){el.focus();try{if(sel)el.setSelectionRange(sel[0],sel[1])}catch(e){}}}
  const rij2=document.querySelector('#view .chiprow');if(rij2&&rijX)rij2.scrollLeft=rijX;
  const ag=document.getElementById('agWrap');
  if(ag){ag.scrollTop=UI.agScroll!=null?UI.agScroll:(480-AG_VAN)*AG_PX-8;ag.addEventListener('scroll',()=>{UI.agScroll=ag.scrollTop},{passive:true})}
}
function setTab(t){UI.tab=TABS.some(x=>x[0]===t)?t:'dashboard';if(location.hash.slice(1)!==UI.tab){try{history.replaceState(null,'','#'+UI.tab)}catch(e){location.hash=UI.tab}}render();window.scrollTo(0,0)}
let toastT=null;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3200)}

/* ---------- Gebeurtenissen ---------- */
document.addEventListener('click',async e=>{
  const tab=e.target.closest('[data-tab]');
  if(tab){e.preventDefault();if(!$('#modal').hidden)closeModal();setTab(tab.dataset.tab);return}
  const el=e.target.closest('[data-act]');
  if(!el)return;
  if(el.tagName==='TR'&&e.target.closest('button,select,input,a'))return;
  const fn=ACT[el.dataset.act];if(!fn)return;
  e.preventDefault();
  try{await fn(el.dataset,el)}catch(err){}
});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.filter==='q'){UI.f.q=t.value;render();return}
  if(t.dataset.agzoek){UI.agZoek=t.value;render();return}
  if(t.dataset.calc){UI.calc[t.dataset.calc]=t.value;render();return}
  if(t.dataset.mix){UI.calc.mix[t.dataset.mix]=t.value;render();return}
  if(t.closest('#lines'))updateHL();
  if(t.id==='m_gemeente'){const r=regioVan(t.value);const s=$('#m_regio');if(s&&r)s.value=r}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.agk){if(!UI.agSel)UI.agSel=new Set();if(t.checked)UI.agSel.add(t.dataset.agk);else UI.agSel.delete(t.dataset.agk);render();return}
  if(t.dataset.filter&&t.dataset.filter!=='q'){UI.f[t.dataset.filter]=t.value;if(t.dataset.filter==='regio'&&UI.f.gemeente&&regioVan(UI.f.gemeente)&&regioVan(UI.f.gemeente)!==t.value)UI.f.gemeente='';render();return}
  if(t.dataset.period){UI[t.dataset.period]=t.value;render();return}
  if(t.dataset.groep){UI.groep=t.value;render();return}
  if(t.dataset.sort){UI.sort=t.value;render();return}
  if(t.dataset.calc){UI.calc[t.dataset.calc]=t.value;render();return}
  if(t.closest('#lines'))updateHL();
  if(t.id==='impFile'){impLees(t.files&&t.files[0]);return}
  if(t.dataset.impdoel!=null&&UI.imp){UI.imp.groups[+t.dataset.impdoel].target=t.value;render();return}
  if(t.dataset.pal){const i=inst();const eh=i.eenheden.map(x=>x.id===t.dataset.pal?Object.assign({},x,{perPallet:t.value===''?null:num(t.value)}):x);try{await putInst(Object.assign({},S.inst||{},{eenheden:eh}));toast('Pallet-aantal bewaard')}catch(err){}return}
  if(t.dataset.szkey){const kid=t.dataset.klant,bier=t.dataset.bier,val=t.value;try{await szSave(t.dataset.szkey,doc=>{doc.aanbod[kid]=doc.aanbod[kid]||{};doc.aanbod[kid][bier]={status:val}})}catch(err){}}
});
document.addEventListener('submit',async e=>{
  const f=e.target;
  if(f.id==='dlgForm'){
    e.preventDefault();if(!MODAL.onSubmit)return;
    const btn=f.querySelector('button[type=submit]');btn.disabled=true;
    try{const na=await MODAL.onSubmit(formObj(f),f);closeModal();if(typeof na==='function')na()}catch(err){btn.disabled=false}
    return;
  }
  if(f.id==='instForm'){
    e.preventDefault();
    const o=formObj(f);
    const eh=[];
    f.querySelectorAll('input[id^="e_naam_"]').forEach(inp=>{
      const n=inp.id.slice(7),naam=inp.value.trim();if(!naam)return;
      const id=inp.dataset.eid||naam.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||newId();
      const p=$('#e_pal_'+n).value;
      eh.push({id:id,naam:naam,liter:num($('#e_liter_'+n).value),perPallet:p===''?null:num(p)});
    });
    const regios=String(o.regios||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{const ix=l.indexOf(':');return ix<0?{naam:l,gemeenten:[]}:{naam:l.slice(0,ix).trim(),gemeenten:l.slice(ix+1).split(',').map(g=>g.trim()).filter(Boolean)}});
    const producten=String(o.producten||'').split('\n').map(x=>x.trim()).filter(Boolean);
    try{
      await putInst({doelMaand:num(o.doelMaand)||DEFAULTS.doelMaand,doelJaar:num(o.doelJaar)||DEFAULTS.doelJaar,eenheden:eh.length?eh:DEFAULTS.eenheden,producten:producten.length?producten:DEFAULTS.producten,regios:regios.length?regios:DEFAULTS.regios});
      UI.extraEenheden=0;toast('Instellingen opgeslagen');
    }catch(err){}
  }
});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==UI.tab)setTab(h)});

/* ---------- Start ---------- */
UI.tab=TABS.some(x=>x[0]===location.hash.slice(1))?location.hash.slice(1):'dashboard';
render();
initDb();
})();
</script>
</body>
</html>
